    {n:19, title:"Rich Dad Poor Dad", author:"Robert T. Kiyosaki", year:"1997", core:"Diverge from linear asset tracks; build cash-flow generation structures over paper liability frameworks."},
    {n:20, title:"Think and Grow Rich", author:"Napoleon Hill", year:"1937", core:"All material fortunes scale from a crystal-clear cognitive blueprint fueled by an emotionalized desire."},
    {n:21, title:"The Intelligent Investor", author:"Benjamin Graham", year:"1949", core:"Insist on rigid analytical margins of safety to counter cyclical marketplace greed and panic fields."},
    {n:22, title:"I Will Teach You To Be Rich", author:"Ramit Sethi", year:"2009", core:"Automate deployment channels; cut minor costs while spending heavily on your true core loves."},
    {n:23, title:"The Millionaire Next Door", author:"Thomas J. Stanley", year:"1996", core:"True equity preservation values lifestyle frugality over performative high-status consumer posturing."},
    {n:24, title:"The Richest Man in Babylon", author:"George S. Clason", year:"1926", core:"Preserve a non-negotiable 10% capital buffer layer out of every single incoming revenue stream."},
    {n:25, title:"Your Money or Your Life", author:"Vicki Robin", year:"1992", core:"Re-evaluate every transaction in terms of life-force hours spent to secure the capital."},
    {n:26, title:"The Total Money Makeover", author:"Dave Ramsey", year:"2003", core:"Clean out consumer liabilities via accelerated debt snowball metrics to maximize cash flow potential."},
    {n:27, title:"The Almanac of Naval Ravikant", author:"Eric Jorgenson", year:"2020", core:"Wealth engineering hinges on unique asset ownership mixed with permissionless modern digital leverage."},
    {n:28, title:"The Millionaire Fastlane", author:"MJ DeMarco", year:"2011", core:"Ditch traditional linear asset timelines; launch highly scalable producer business architectures now."},
    {n:29, title:"Secrets of the Millionaire Mind", author:"T. Harv Eker", year:"2005", core:"Subconscious childhood money blueprints completely govern terminal financial results until aggressively rewritten."},
    {n:30, title:"Die with Zero", author:"Bill Perkins", year:"2020", core:"Optimize the lifespan trajectory matrix by purchasing priceless experience memory dividends early."},
    {n:31, title:"The Simple Path to Wealth", author:"JL Collins", year:"2016", core:"Eradicate investment complexity; deploy simple low-cost stock index fund compound avenues mechanics."},
    {n:32, title:"Cashflow Quadrant", author:"Robert T. Kiyosaki", year:"2000", core:"Transition operations from time sales grids into automated right-side systemic business assets."},
    {n:33, title:"Unshakeable", author:"Tony Robbins", year:"2017", core:"Insulate investment nodes from macro volatility parameters using core tactical protection asset frameworks."},
    {n:34, title:"The Secret", author:"Rhonda Byrne", year:"2006", core:"Dominant internal visualization metrics broadcast outward to pull matching physical real-world scenarios."},
    {n:35, title:"The Power of Now", author:"Eckhart Tolle", year:"1997", core:"All ego suffering dissolves cleanly when identifying with spacious awareness vs passing thought clouds."},
    {n:36, title:"Ask and It Is Given", author:"Esther & Jerry Hicks", year:"2004", core:"Your emotion engine serves as a real-time tracking compass relative to universal source energy lines."},
    {n:37, title:"Breaking the Habit of Being Yourself", author:"Joe Dispenza", year:"2012", core:"Decouple your cellular biochemical loops from legacy emotional system scripts via neuroplasticity drills."},
    {n:38, title:"Think Like a Monk", author:"Jay Shetty", year:"2020", core:"Strip away social engineering scripts to uncover authentic alignment vectors and service tracks cleanly."},
    {n:39, title:"The Alchemist", author:"Paulo Coelho", year:"1988", core:"Track structural environmental signs to fulfill your unique destiny parameters across life's trials."},
    {n:40, title:"Good Vibes, Good Life", author:"Vex King", year:"2018", core:"Elevate structural frequency levels through boundary enforcement and strict emotional state maintenance."},
    {n:41, title:"Manifest: 7 Steps to Living Your Best Life", author:"Roxie Nafousi", year:"2022", core:"Manifestation represents a rigorous discipline of structured, action-oriented personal development systems."},
    {n:42, title:"As a Man Thinketh", author:"James Allen", year:"1903", core:"Mind stands as the undisputed sovereign weaver of inner character networks and outer environments."},
    {n:43, title:"The Four Agreements", author:"Don Miguel Ruiz", year:"1997", core:"Dissolve conditioning cages by adopting four ancient Toltec structural personal agreements with yourself."},
    {n:44, title:"Soundtracks", author:"Jon Acuff", year:"2021", core:"Overthinking is an unoptimized software feedback loop; overwrite it using custom affirmative tracks intentionally."},
    {n:45, title:"Super Attractor", author:"Gabrielle Bernstein", year:"2019", core:"Prioritize internal alignment tracking parameters over frantic, fear-based marketplace action grind patterns."},
    {n:46, title:"The Magic of Thinking Big", author:"David J. Schwartz", year:"1959", core:"The macro dimensions of long-term milestones map back strictly to initial thought scaling fields."},
    {n:47, title:"Feeling Is the Secret", author:"Neville Goddard", year:"1944", core:"The subconscious substrate bypasses cold analytical argument; it integrates via intense sensory emotional states."},
    {n:48, title:"The Master Key System", author:"Charles F. Haanel", year:"1912", core:"A weekly concentration framework designed to link your baseline focus engine with cosmic fields."},
    {n:49, title:"You Are a Badass at Making Money", author:"Jen Sincero", year:"2017", core:"Smash ancestral lack programming; quote your real market value with absolute execution pride."},
    {n:50, title:"The Untethered Soul", author:"Michael A. Singer", year:"2007", core:"Claim true operational freedom by detaching state parameters from your inner roommate's voice chatter loops."}

  te: [
    {n:1, title:"విజయానికి ఐదు మెట్లు", author:"యండమూరి వీరేంద్రనాథ్", year:"1990", core:"విజయం అనేది ఆకస్మికంగా వచ్చేది కాదు; అది క్రమశిక్షణ, వ్యూహం మరియు నిరంతర ఆత్మపరిశీలన ఫలితం."},
    {n:2, title:"మీ మనసే మీ గెలుపు", author:"బి. వి. పట్టాభిరామ్", year:"2005", core:"మానసిక నియంత్రణ, ఆలోచనా విధానాల శుద్ధీకరణే మనిషి యొక్క అంతర్గత మరియు బాహ్య విజయాలను శాసిస్తాయి."},
    {n:3, title:"రిచ్ డాడ్ పూర్ డాడ్ (తెలుగు)", author:"రాబర్ట్ కియోసాకి", year:"1997", core:"ఆర్థిక స్వాతంత్ర్యం కావాలంటే కేవలం ఉద్యోగం చేయడం సరిపోదు; డబ్బు మీ కోసం పనిచేసేలా ఆస్తులను సృష్టించాలి."},
    {n:4, title:"ఆలోచించండి - ఐశ్వర్యవంతులు అవ్వండి", author:"నెపోలియన్ హిల్", year:"1937", core:"ఐశ్వర్యం మరియు విజయం అనేవి ఒక బలమైన మానసిక సంకల్పం, తీవ్రమైన కోరిక మరియు నిరంతర ప్రణాళికల ద్వారానే సాధ్యమవుతాయి."},
    {n:5, title:"రహస్యం (The Secret)", author:"రోండా బైర్న్", year:"2006", core:"ఆకర్షణ సిద్ధాంతం (Law of Attraction) ద్వారా విశ్వంలోని శక్తులను మన ఆలోచనలతో ప్రభావితం చేసి అనుకున్నది సాధించవచ్చు."},
    {n:6, title:"అటామిక్ హ్యాబిట్స్", author:"జేమ్స్ క్లియర్", year:"2018", core:"చిన్న అలవాట్లు 1% చొప్పున ప్రతిరోజూ మారితే, కాలక్రమేణా అవి అద్భుతమైన మార్పులను తీసుకువస్తాయి."},
    {n:7, title:"మనీ పర్స్ (Money Purse)", author:"యండగండి సత్యనారాయణ", year:"2012", core:"భారతీయ కుటుంబాల ఆర్థిక నిర్వహణకు, పొదుపు మరియు పెట్టుబడి సూత్రాలను వివరించే అద్భుత గ్రంథం."},
    {n:8, title:"అతి ప్రభావశీల వ్యక్తుల 7 అలవాట్లు", author:"స్టీఫెన్ కోవే", year:"1989", core:"విజయవంతమైన జీవితం కోసం అంతర్గత క్యారెక్టర్‌ను మార్చే ఏడు ముఖ్యమైన అలవాట్ల విశ్లేషణ."},
    {n:9, title:"మీ ఉపచేతన మనస్సు యొక్క శక్తి", author:"జోసెఫ్ మర్ఫీ", year:"1963", core:"ఉపచేతన మనస్సును సానుకూలంగా రీప్రోగ్రామ్ చేయడం ద్వారా ఆరోగ్యం, సంపద మరియు విజయం సాధించవచ్చు."},
    {n:10, title:"ప్రస్తుత క్షణపు శక్తి (The Power of Now)", author:"ఎకార్ట్ టోల్లే", year:"1997", core:"గతాన్ని, భవిష్యత్తును వీడి ప్రస్తుత క్షణంలో బతకడమే సర్వ దుఃఖాలకు నివారణ మరియు నిజమైన శాంతి."},
    {n:11, title:"సన్యాసిగా మారిన కోటీశ్వరుడు", author:"రాబిన్ శర్మ", year:"1997", core:"భౌతిక సంపదతో పాటు అంతర్గత ఆధ్యాత్మిక ప్రశాంతతను ఎలా సాధించాలో తెలిపే కథా రూపక పుస్తకం."},
    {n:12, title:"నువ్వు కూడా గెలవగలవు (You Can Win)", author:"శివ్ ఖేరా", year:"1998", core:"సానుకూల దృక్పథం, ఆత్మవిశ్వాసం మరియు సరైన లక్ష్యాల ద్వారా సామాన్యులు కూడా అసాధారణ విజయాలు సాధించగలరు."},
    {n:13, title:"ఇకిగాయ్ (Ikigai)", author:"హెక్టర్ గార్సియా", year:"2016", core:"జపాన్ దేశస్థుల సుదీర్ఘ, సంతోషకరమైన జీవిత రహస్యమైన 'జీవన పరమార్థం' గురించిన వివరణ."},
    {n:14, title:"సైకాలジー ఆఫ్ మニー", author:"మోర్గాన్ హౌసెల్", year:"2020", core:"డబ్బుతో మనం ఎలా ప్రవర్తిస్తామనేది మనకు ఎంత గణితం తెలుసనే దానికంటే చాలా ముఖ్యం."},
    {n:15, title:"గెలుపు పిలుపు", author:"బి. వి. పట్టాభిరామ్", year:"2008", core:"యువత తమ కెరీర్ లో ఎదురయ్యే సవాళ్లను దాటి విజయం వైపు ఎలా అడుగులు వేయాలో నేర్పే గైడ్."},
    {n:16, title:"విజయం వైపు పయనం", author:"యండమూరి వీరేంద్రనాథ్", year:"1995", core:"విద్యార్థులు, నిరుద్యోగులు తమ అంతర్గత శక్తులను గుర్తించి సమాజంలో ఎలా ఎదగాలి అనే అంశాల విశ్లేషణ."},
    {n:17, title:"గ్రిట్ (Grit)", author:"ఆంజెలా డక్‌వర్త్", year:"2016", core:"విజయానికి కేవలం ప్రతిభే కాదు, పట్టుదల మరియు నిరంతర శ్రమ (Grit) అత్యంత అవసరమని నిరూపించే పుస్తకం."},
    {n:18, title:"ఆల్కెమిస్ట్ (The Alchemist)", author:"పాలో కోయెల్హో", year:"1988", core:"మన కలలను నిజం చేసుకునే ప్రయాణంలో ప్రకృతి సంకేతాలను ఎలా అర్థం చేసుకోవాలో తెలిపే అద్భుత నవల."},
    {n:19, title:"నాల్గు ఒప్పందాలు (The Four Agreements)", author:"డాన్ మిగుల్ రూయిజ్", year:"1997", core:"వ్యక్తిగత స్వేచ్ఛ మరియు ఆనందం కోసం ప్రాచీన టోల్టెక్ సంస్కృతి అందించిన నాలుగు సూత్రాలు."},
    {n:20, title:"కాలజ్ఞానం (Time Management)", author:"స్థానిక నిపుణులు", year:"2010", core:"సమయాన్ని వృథా చేయకుండా ఉత్పాదకతను ఎలా పెంచుకోవాలో తెలిపే కాల నిర్వహణ సూత్రాలు."},
    {n:21, title:"ఆత్మ సాక్షాత్కారం", author:"పరమహంస యోగానంద", year:"1946", core:"భారతీయ యోగ విజ్ఞానం, ఉపచేతన మనస్సును మించిన ఆత్మ శక్తి యొక్క ప్రాముఖ్యతను తెలిపే గ్రంథం."},
    {n:22, title:"కర్మ (Karma)", author:"సద్గురు జగీ వాసుదేవ్", year:"2021", core:"కర్మ అంటే కేవలం గతం కాదు, అది మీ జీవితాన్ని మీ చేతుల్లోకి తీసుకునే బాధ్యత అని వివరించే పుస్తకం."},
    {n:23, title:"5 AM క్లబ్", author:"రాబిన్ శర్మ", year:"2018", core:"ఉదయం 5 గంటలకే నిద్రలేచి మొదటి గంటను మీ ఆత్మవిమర్శకు, ఎదుగుదలకు కేటాయించడం ద్వారా అద్భుతాలు చేయవచ్చు."},
    {n:24, title:"మీ జీవితాన్ని మీరే సరిదిద్దుకోండి", author:"లూయిస్ హే", year:"1984", core:"సానుకూల ఆలోచనలు మరియు స్వీయ ప్రేమ ద్వారా శారీరక, మానసిక రుగ్మతలను నయం చేసుకోవచ్చు."},
    {n:25, title:"నెగటివ్ థింకింగ్ వదిలేయండి", author:"నిక్ ట్రెంటన్", year:"2021", core:"ఓవర్‌థింకింగ్ మరియు అనవసరపు ఆందోళనల నుండి మైండ్‌ను ఎలా విముక్తం చేయాలో తెలిపే పుస్తకం."},
    {n:26, title:"సంపూర్ణ విజయం", author:"యండమూరి వీరేంద్రనాథ్", year:"2002", core:"వ్యక్తిగత వికాసంలోని అన్ని కోణాలను స్పృశిస్తూ సమగ్ర విజయ సాధనకు మార్గదర్శి."},
    {n:27, title:"కాలం మీ చేతుల్లో", author:"బి. వి. పట్టాభిరామ్", year:"2011", core:"సమయాన్ని మేనేజ్ చేయడం అంటే గడియారాన్ని చూడటం కాదు, మీ ప్రాధాన్యతలను నియంత్రించడం అని చెప్పే పుస్తకం."},
    {n:28, title:"అన్-టెథర్డ్ సోల్", author:"మైకేల్ సింగర్", year:"2007", core:"మీ లోపల వినిపించే నిరంతర భయాందోళనల వాయిస్ నుండి మిమ్మల్ని మీరు ఎలా వేరు చేసుకోవాలో తెలిపే గ్రంథం."},
    {n:29, title:"సంకల్ప శక్తి", author:"స్వదేశీ సంకలనం", year:"2014", core:"దృఢమైన సంకల్పం ఉంటే ఎంతటి కష్టమైన పనైనా సులభంగా ఎలా ప్రయాణించవచ్చో వివరించే పుస్తకం."},
    {n:30, title:"అపరిమిత శక్తులు", author:"టోనీ రాబిన్స్", year:"1986", core:"విజయవంతమైన వ్యక్తుల బాడీ లాంగ్వేజ్, ఆలోచనలను మోడలింగ్ చేయడం ద్వారా అదే ఫలితాలు సాధించవచ్చు."},

let BOOKS = [];

function setLanguage(langCode) {
  stopSpeechEngine();
  currentLang = langCode;
  
  const rawList = BOOK_DATASETS[currentLang];
  const dict = CONFIG[currentLang];
  
  // Advanced Concept Extraction Loop Engine
  BOOKS = rawList.map(item => {
    let processedConcepts = [];
    const dynMap = SYSTEM_DYNAMICS[currentLang];
    
    for(let i=0; i<10; i++) {
      // Fetch dynamic title context lines or default smoothly back to template index nodes cleanly
      let conceptNode = (dynMap && dynMap[item.n]) ? dynMap[item.n] : (dynMap && dynMap[1] ? dynMap[1] : {name: dict.concepts[i], description: dict.texts[i]});
      
      // Select appropriate customized statement segments layout matrices based on loop context fields safely
      let cTitle = (dynMap && dynMap[item.n]) ? `${item.title} · ${dynMap[id = (item.n > 50 ? 1 : item.n)] ? CONFIG[currentLang].concepts[i] : dict.concepts[i]}` : `${item.title} · ${dict.concepts[i]}`;
      
      // Inject customized specific text data arrays statements
      let specificText = dict.texts[i];
      if (currentLang === 'en') {
        const specializedContext = dynMap[item.n] || dynMap[1];
        const tokenName = specializedContext.name || "Systematic Target Execution";
        const tokenDesc = specializedContext.description || "Leveraging process design architecture parameters safely.";
        specificText = `Focus processing tracks deeply around <b>${tokenName}</b>. ${tokenDesc} <b>Takeaway Analysis:</b> ${dict.texts[i].split("<b>Takeaway Analysis:</b>")[1] || dict.texts[i]}`;
      } else if (currentLang === 'te') {
        const teContext = SYSTEM_DYNAMICS.te[item.n] || SYSTEM_DYNAMICS.te[1];
        specificText = `మీరు ఈ పుస్తకంలో ముఖ్యంగా గమనించాల్సిన అంశం: <b>${teContext.name}</b>. ${teContext.description} <b>ముఖ్య విశ్లేషణ:</b> ${dict.texts[i].split("<b>ముఖ్య విశ్లేషణ:</b>")[1] || dict.texts[i]}`;
      } else if (currentLang === 'de') {
        const deContext = SYSTEM_DYNAMICS.de[item.n] || SYSTEM_DYNAMICS.de[1];
        specificText = `Ein absoluter Kernpunkt dieses Werks basiert auf: <b>${deContext.name}</b>. ${deContext.description} <b>Takeaway-Analyse:</b> ${dict.texts[i].split("<b>Takeaway-Analyse:</b>")[1] || dict.texts[i]}`;
      }

      processedConcepts.push({
        h: cTitle,
        p: specificText
      });
    }

    return {
      n: item.n,
      title: item.title,
      author: item.author,
      year: item.year,
      cat: dict.cats[Math.floor((item.n - 1) / 17)] || dict.cats[0],
      core: item.core,
      concepts: processedConcepts,
      sig: item.sig || `${dict.sigSuffix}`
    };
  });
  
  document.getElementById('libTitle').innerHTML = dict.appTitle;
  document.getElementById('contentsBtn').innerText = dict.indexBtn;
  document.getElementById('indexHeading').innerText = dict.indexHead;
  document.getElementById('closeOv').innerText = dict.closeBtn;
  
  document.getElementById('prev').innerHTML = dict.prevBtn;
  document.getElementById('next').innerHTML = dict.nextBtn;
  document.getElementById('navigationHint').innerText = dict.hint;
  
  updateSpeakButtonLabel();
  
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.id === `btn-lang-${langCode}`);
  });

  rebuildIndexGrid();
  render();
}

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const pfill = document.getElementById('pfill');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const grid = document.getElementById('grid');

function esc(s){
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const b = BOOKS[idx];
  const num = String(b.n).padStart(2,'0');
  const dict = CONFIG[currentLang];
  
  const conceptsHTML = b.concepts.map((c,i)=>`
    <li style="animation-delay:${0.04 + i*0.02}s">
      <span class="mk">◆</span>
      <div>
        <h4>${esc(c.h)}</h4>
        <p>${c.p}</p>
      </div>
    </li>`).join('');

  stage.innerHTML = `
    <div class="book">
      <aside class="book-left">
        <div class="emblem">
          <div class="ring"></div>
          <div class="ring spin"></div>
          <div class="ring r2"></div>
          <div class="bignum">${num}</div>
        </div>
        <div class="cat">${esc(b.cat)}</div>
      </aside>
      <div class="book-main">
        <h1 class="b-title">${esc(b.title)}</h1>
        <div class="b-meta">${dict.authorLbl}: <b>${esc(b.author)}</b> &nbsp;·&nbsp; ${dict.yearLbl}: ${b.year}</div>
        <div class="core">
          <span class="lbl">${dict.coreLbl}</span>
          <p>${esc(b.core)}</p>
        </div>
        <ul class="concepts">${conceptsHTML}</ul>
        <div class="signature" style="animation-delay:${0.1 + b.concepts.length*0.02}s">
          <span class="lbl">${dict.principleLbl}</span>
          <p>“${esc(b.sig)}”</p>
        </div>
      </div>
    </div>`;

  counter.innerHTML = `<b>${num}</b> / 50`;
  pfill.style.width = ((b.n)/50*100)+'%';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === BOOKS.length - 1;
  
  document.querySelector('main').scrollTop = 0;
  updateGridActiveStates();
}

function rebuildIndexGrid() {
  grid.innerHTML = BOOKS.map((b,i)=>`
    <button class="gcard" data-i="${i}" onclick="jump(${i})">
      <span class="gn">${String(b.n).padStart(2,'0')}</span>
      <span class="gt">${esc(b.title)}<span class="ga">${esc(b.author)}</span></span>
    </button>`).join('');
}

function go(d){ 
  stopSpeechEngine();
  const t = idx + d; 
  if(t >= 0 && t < BOOKS.length){ idx = t; render(); } 
}

// Global Touch Lifecycle Action Interrupters
function jump(i){ 
  stopSpeechEngine();
  idx = i; 
  render(); 
  closeOverlay(); 
}

function updateGridActiveStates(){
  grid.querySelectorAll('.gcard').forEach((c,i) => c.classList.toggle('active', i === idx));
}

function toggleSpeech() {
  if (window.speechSynthesis.speaking) {
    stopSpeechEngine();
  } else {
    startSpeechEngine();
  }
}

function startSpeechEngine() {
  window.speechSynthesis.cancel(); 
  const b = BOOKS[idx];
  const dict = CONFIG[currentLang];
  
  let textSegments = [
    b.title,
    `${dict.authorLbl}: ${b.author}`,
    b.core
  ];
  
  b.concepts.forEach(c => {
    let plainText = c.p.replace(/<\/?[^>]+(>|$)/g, "");
    textSegments.push(`${c.h}. ${plainText}`);
  });
  
  textSegments.push(b.sig);
  
  const masterUtteranceString = textSegments.join('. ');
  const utterance = new SpeechSynthesisUtterance(masterUtteranceString);
  utterance.lang = dict.speechLang;
  utterance.rate = 1.0;
  
  utterance.onend = () => {
    stopSpeechEngine();
  };
  utterance.onerror = () => {
    stopSpeechEngine();
  };
  
  document.getElementById('speakBtn').innerText = dict.speakStop;
  document.getElementById('speakBtn').classList.add('reading-active');
  window.speechSynthesis.speak(utterance);
}

function stopSpeechEngine() {
  window.speechSynthesis.cancel();
  updateSpeakButtonLabel();
  document.getElementById('speakBtn').classList.remove('reading-active');
}

function updateSpeakButtonLabel() {
  document.getElementById('speakBtn').innerText = CONFIG[currentLang].speakStart;
}

prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);

addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'Escape') closeOverlay();
});

let tx = 0;
addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx; 
  if(Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive:true});

const overlay = document.getElementById('overlay');
document.getElementById('contentsBtn').onclick = () => {
  stopSpeechEngine();
  overlay.classList.add('open');
  updateGridActiveStates();
};

document.getElementById('closeOv').onclick = closeOverlay;
function closeOverlay(){ overlay.classList.remove('open'); }

    sh.push(`${Math.floor(Math.random()*2000)}px ${Math.floor(Math.random()*2000)}px rgba(246,227,168,${0.25 + Math.random()*0.65})`);

  s.style.cssText = `position:absolute;width:1.2px;height:1.2px;border-radius:50%;box-shadow:${sh.join(',')};animation:fl 140s linear infinite`;

  s2.style.top = '2000px';

  el.appendChild(s); 
  el.appendChild(s2);
})();
