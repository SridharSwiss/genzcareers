  .lib-title{font-family:'Cinzel', serif;font-weight:600;letter-spacing:.12em;
    font-size:clamp(.7rem,1.6vw,1rem);color:var(--gold);text-transform:uppercase}
  .lib-title span{color:var(--cream-dim);font-weight:400;letter-spacing:.05em}

  .counter b{color:var(--gold)}
  .btn{font-family:sans-serif;font-size:.75rem;color:var(--cream);background:transparent;border:1px solid var(--line);
    padding:.5rem 1rem;border-radius:3px;cursor:pointer;transition:all .3s}
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);box-shadow:0 0 18px -6px var(--glow)}

  .progress{height:2px;background:rgba(232,200,121,0.08);flex-shrink:0;position:relative;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright));

  main{flex:1;display:flex;align-items:flex-start;justify-content:center;

  @media(max-width:820px){.book-left{position:static;flex-direction:row;align-items:center;justify-content:space-between;width:100%}}

  .emblem .ring.r2{inset:12px;border-color:rgba(232,200,121,0.1)}
  .emblem .ring.spin{border-top-color:var(--gold);border-right-color:transparent;
    border-bottom-color:transparent;border-left-color:transparent;animation:spin 16s linear infinite}

  .bignum{font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700;
    font-size:clamp(2.5rem,6vw,4rem);color:var(--gold);line-height:1;

  .cat{font-family:sans-serif;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;

  .concepts p{font-size:1rem;color:var(--cream-dim);line-height:1.65;max-width:65ch}
  .concepts p b{color:var(--ember);font-weight:700}

  .signature{border-top:1px solid var(--line);padding-top:1.2rem;animation:rise .7s ease .5s both}
  .signature p{font-size:clamp(1rem,1.8vw,1.2rem);color:var(--gold-bright);line-height:1.5;font-style:italic}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}

  .controls{display:flex;justify-content:space-between;align-items:center;
    padding:1rem clamp(1.1rem,4vw,2.6rem) 1.4rem;flex-shrink:0;gap:1rem;background:linear-gradient(transparent, var(--void))}
  .nav-btn{font-size:.8rem;color:var(--cream);background:transparent;border:1px solid var(--line);
    padding:.7rem 1.4rem;border-radius:4px;cursor:pointer;transition:all .3s;white-space:nowrap}
  .nav-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright);box-shadow:0 0 22px -8px var(--glow);transform:translateY(-1px)}
  .nav-btn:disabled{opacity:.25;cursor:not-allowed}
  .hint{font-size:.82rem;color:rgba(188,178,154,.45);font-style:italic;text-align:center}
  @media(max-width:600px){.hint{display:none}}

  .overlay{position:fixed;inset:0;z-index:100;background:rgba(4,6,12,0.97);backdrop-filter:blur(12px);
    display:none;flex-direction:column;padding:clamp(1.2rem,4vw,2.6rem)}
  .overlay.open{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .ov-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6rem;flex-shrink:0}
  .ov-head h2{font-weight:700;color:var(--gold);font-size:clamp(1.1rem,3vw,1.4rem)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem;
    overflow-y:auto;padding-right:.4rem;align-content:start}
  .gcard{text-align:left;background:rgba(232,200,121,0.02);border:1px solid var(--line);
    border-radius:4px;padding:.85rem 1rem;cursor:pointer;transition:all .2s;display:flex;gap:.8rem;align-items:baseline}
  .gcard:hover{border-color:var(--gold);background:rgba(232,200,121,0.07);transform:translateY(-2px)}
  .gcard.active{border-color:var(--gold);background:rgba(232,200,121,0.09);box-shadow:0 0 12px rgba(232,200,121,0.1)}
  .gcard .gn{font-family:'Cinzel',serif;color:var(--gold);font-size:.8rem;flex-shrink:0;min-width:1.8em;font-weight:600}

  .grid::-webkit-scrollbar-track,main::-webkit-scrollbar-track{background:transparent}
</style>
</head>

      `చిన్న చిన్న పנוల నుండి పెద్ద విజయాల వరకు క్రమశిక్షణే ముఖ్యం. సమయాన్ని వృథా చేయకుండా పెట్టుబడిగా మార్చాలి. <b>ముఖ్య విశ్లేషణ:</b> ప్రతిరోజు ఉదయాన్నే ఆ రోజు చేయాల్సిన పనుల ప్రాధాన్యతలను నిర్ణయించుకుని, వాటిని వాయిదా వేయకుండా పూర్తి చేయండి.`,
      `పరిస్థితులు ఎలా ఉన్నా, వాటిని మనం ఎలా స్వీకరిస్తామनेదే మన భవిష్యత్తును నిర్ణయిస్తుంది. సమస్యల కంటే పరిష్కారాలపై దృష్టి పెట్టాలి. <b>ముఖ్య విశ్లేషణ:</b> మీ మైండ్ లోకి వచ్చే ప్రతికూల ఆలోచనలను వెంటనే సాнуకూల ప్రత్యామ్నాయాలతో భర్తీ చేయడం ప్రాక్టీ斯 చేయండి.`,
      `ఓటమి అనేది ప్రయాణానికి ముగింపు కాదు, అది కేవలం ఒక ముఖ్యమైన పాఠం మాత్రమే. విజయానికి అది ఒక అద్భుతమైన మెట్టు. <b>ముఖ్య విశ్లేషణ:</b> పరాజయం ఎదురైనప్పుడు నిరాश పడకుండా, ఎక్కడ లోపం జరిగిందో గమనించి వ్యూహాన్ని మార్చాలి.`,
      `ఉపచేతన మనస్సును సానుకూలంగా ఉంచడం ద్వారా అద్భుతాలు చేయవచ్చు. రాత్రి పడుకునే ముందు మీ విజయాలను ఊహించుకోండి. <b>ముఖ్య విశ్లేషణ:</b> మీ అంతర్గత భయాలను తొลగించి, సమృద్ధి (Abundance) మైండ్‌సెట్ ని అలవాటు చేసుకోవడం విజయానికి తిరుగులేని మార్గం.`,
      `సోషల్ మీడియా, అనవసరపు పరధ్యానాలను తగ్గించుకుని ఏకాగ్రతను పెంచుకోవాలి. దృష్టి కేంద్రీకరణే మీ అతిపెద్ద ఆస్తి. <b>ముఖ్య విశ్లేషణ:</b> హై-വాల్యూ పనులు చేసేటప్పుడు నోటిఫికేషన్లు ఆఫ్ చేయండి. మీ అటెन्షన్ ని ఇతరుల కోసం వృథా చేయకండి.`,
      `నలుగురితో సత్సంబంధాలను ఏర్పరచుకోవడం, ఇతరులు చెప్పేది శ్రద్ధగా వినడం ద్వారా సమాజంలో మంచి నెట్‌వర్క్ ఏర్పడుతుంది. <b>ముఖ్య విశ్లేషణ:</b> కేవలం మీ స్వార్థం కోసం కాకుండా, ఇتరుల ఎదుగుదలకు కూడా సహాయపడేలా మీ సంబంధాలను బలోపేతం చేసుకోండి.`,
      `కేవలం కష్టపడి పనిచేయడం వల్ల ఫలితం ఉండదు. దానికి సరైన వ్యూహం, స్మార్ట్ వర్క్, లేదా సిస్టమ్స్ తోడవ్వాలి. <b>ముఖ్య విశ్లేషణ:</b> తక్కువ శ్రమతో ఎక్కువ ఫలితాన్ని ఇచ్చే 80/20 సూత్రాన్ని లేదా డిజిటల్ లెవరేజ్ ని మీ పనుల్లో ఉపయోగించండి.`,
      `ఎంత ఎదిగినా నైతిక విలువలు, మానవత్వం కోల్పోకూడదు. నిజమైన విజయం సమాజానికి ఉపయోగపడేలా ఉండాలి. <b>ముఖ్య విశ్లేషణ:</b> కేవలం భౌతిక సంపదతోనే ఆగకుండా, అంతర్గత ప్రశాంతతను మరియు సమాజంలో మంచి గుర్తింపును సాధించండి.`
    ]
  },

      `Hör auf, Ausreden bei Lehrern, Eltern oder dem System zu suchen. Deine Reaktion auf Ereignisse bestimmt deine Zukunft. <b>Takeaway-Analyse:</b> Nimm dein Leben zu 100% selbst in die Hand. Du bist der Programmierer deines Erfolgs.`,
      `Arbeite klug, nicht nur hart. Nutze Netzwerke, digitale Tools oder finanzielle Hebel, um mit weniger Energie maximale Ergebnisse zu erzielen. <b>Takeaway-Analyse:</b> Baue Systeme oder lerne Fähigkeiten, die für dich arbeiten, auch wenn du schläfst.`,
      `Große Träume schüchtern ein. Zerlege sie in winzige tägliche Routinen. 1% Verbesserung jeden Tag summiert sich exponentiell. <b>Takeaway-Analyse:</b> Optimiere deine Morgen- und Abendroutine. Deine Gewohnheiten formen deinen Charakter.`,
      `Der Moment des Zögerns ist der Feind. Handle sofort, wenn eine wichtige Aufgabe ansteht, bevor dein Gehirn eine Ausrede generieren kann. <b>Takeaway-Analyse:</b> Nutze feste Countdown-Regeln wie das laute Herunterzählen von 5 bis 1, um direkt in Aktion zu kommen.`,

      `Alte Sätze wie 'Ich bin nicht gut in Mathe' oder 'Geld ist schlecht' blockieren dich unbewusst im Quantenfeld. <b>Takeaway-Analyse:</b> Erwische dich selbst bei negativen Gedanken, streiche sie radikal und ersetze sie durch stärkende Überzeugungen.`,
      `Multitasking ist eine biologische Illusion und zerstört deine Gehirnleistung. Schalte beim Lernen alle Social-Media-Benachrichtigungen ab. <b>Takeaway-Analyse:</b> Widme dich für 60 bis 90 Minuten völlig isoliert einer einzigen Aufgabe. Qualität braucht ungeteilten Fokus.`,
      `Lerne, deine Gefühle aktiv zu steuern, anstatt nur blind auf äußere Reize zu reagieren. Deine Körperhaltung verändert deine Biochemie. <b>Takeaway-Analyse:</b> Stehe aufrecht, atme tief durch und nimm eine Siegerpose ein, um Prüfungsangst und Zweifel augenblicklich zu vertreiben.`,
      `Es gibt kein echtes Scheitern, es gibt nur wertvolle Daten und wichtige Lektionen. Jeder Fehlschlag macht dein System präziser. <b>Takeaway-Analyse:</b> Analysiere eine schlechte Note oder ein misslungenes Projekt emotionslos wie ein Wissenschaftler und passe deinen Plan an.`,

let currentLang = 'en';
let idx = 0;

// Dynamic Localization Engine Processor
function buildLocalizedBook(registryItem, langCode) {
  const localMeta = registryItem[langCode] || registryItem['en'];
  const localPack = LOCALIZATION[langCode];
  
  // Deterministic concept nodes builder array mapping
  let processedConcepts = [];
  for(let i=0; i<10; i++) {
    processedConcepts.push({
      h: `${localMeta.title} · ${localPack.concepts[i]}`,
      p: localPack.texts[i]
    });
  }

  return {
    n: registryItem.id,
    title: localMeta.title,
    author: localMeta.author,
    year: localMeta.year,
    cat: localPack.cats[Math.floor((registryItem.id - 1) / 17)] || localPack.cats[0],
    core: localMeta.core,
    concepts: processedConcepts,
    sig: `${localPack.sigSuffix}`
  };
}

// Global Core Application State Arrays Container
let BOOKS = [];

function setLanguage(langCode) {
  currentLang = langCode;
  
  // Re-map application state matrix
  BOOKS = UNIVERSAL_REGISTRY.map(item => buildLocalizedBook(item, currentLang));
  
  // Re-render UI labels definitions text
  const dict = LOCALIZATION[currentLang];
  document.getElementById('libTitle').innerHTML = dict.appTitle;
  document.getElementById('contentsBtn').innerText = dict.indexBtn;
  document.getElementById('indexHeading').innerText = dict.indexHead;
  document.getElementById('closeOv').innerText = dict.closeBtn;
  document.getElementById('prev').innerText = dict.prevBtn;
  document.getElementById('next').innerText = dict.nextBtn;
  document.getElementById('navigationHint').innerText = dict.hint;
  
  // Toggle active language button state highlight clear checks
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${langCode}'`));
  });

  // Rebuild components mapping layout engine index
  rebuildIndexGrid();
  render();
}

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const pfill = document.getElementById('pfill');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const grid = document.getElementById('grid');

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const b = BOOKS[idx];
  const num = String(b.n).padStart(2,'0');
  const dict = LOCALIZATION[currentLang];
  
  const conceptsHTML = b.concepts.map((c,i)=>`
    <li style="animation-delay:${0.06 + i*0.02}s">
      <span class="mk">◆</span>
      <div>
        <h4>${esc(c.h)}</h4>
        <p>${c.p}</p>
      </div>
    </li>`).join('');

  stage.innerHTML = `
    <div class="book">
      <aside class="book-left">
        <div class="emblem">
          <div class="ring"></div>
          <div class="ring spin"></div>
          <div class="ring r2"></div>
          <div class="bignum">${num}</div>
        </div>
        <div class="cat">${esc(b.cat)}</div>
      </aside>
      <div class="book-main">
        <h1 class="b-title">${esc(b.title)}</h1>
        <div class="b-meta">${dict.authorLbl}: <b>${esc(b.author)}</b> &nbsp;·&nbsp; ${dict.yearLbl}: ${b.year}</div>
        <div class="core">
          <span class="lbl">${dict.coreLbl}</span>
          <p>${esc(b.core)}</p>
        </div>
        <ul class="concepts">${conceptsHTML}</ul>
        <div class="signature" style="animation-delay:${0.1 + b.concepts.length*0.02}s">
          <span class="lbl">${dict.principleLbl}</span>
          <p>“${esc(b.sig)}”</p>
        </div>
      </div>
    </div>`;

  counter.innerHTML = `<b>${num}</b> / 50`;
  pfill.style.width = ((b.n)/50*100)+'%';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === BOOKS.length - 1;
  
  document.querySelector('main').scrollTop = 0;
  updateGridActiveStates();
}

function rebuildIndexGrid() {
  grid.innerHTML = BOOKS.map((b,i)=>`
    <button class="gcard" data-i="${i}" onclick="jump(${i})">
      <span class="gn">${String(b.n).padStart(2,'0')}</span>
      <span class="gt">${esc(b.title)}<span class="ga">${esc(b.author)}</span></span>
    </button>`).join('');
}

function updateGridActiveStates(){
  grid.querySelectorAll('.gcard').forEach((c,i) => c.classList.toggle('active', i === idx));
}

function go(d){ 
  const t = idx + d; 
  if(t >= 0 && t < BOOKS.length){ idx = t; render(); } 
}

function jump(i){ 
  idx = i; 
  render(); 
  closeOverlay(); 
}

prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);

addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'Escape') closeOverlay();
});

// Touch controls for mobile responsiveness navigation layout view parameters
let tx = 0;
addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx; 
  if(Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive:true});

const overlay = document.getElementById('overlay');
document.getElementById('contentsBtn').onclick = () => {
  overlay.classList.add('open');
  updateGridActiveStates();
};

document.getElementById('closeOv').onclick = closeOverlay;
function closeOverlay(){ overlay.classList.remove('open'); }

// Cosmic Celestial Space Starfield Canvas Generation Engine
(function(){
  const el = document.querySelector('.stars'); 
  let sh = [];
  for(let i=0; i<140; i++){
    sh.push(`${Math.floor(Math.random()*2000)}px ${Math.floor(Math.random()*2000)}px rgba(246,227,168,${0.25 + Math.random()*0.65})`);
  }
  const s = document.createElement('div');
  s.style.cssText = `position:absolute;width:1.2px;height:1.2px;border-radius:50%;box-shadow:${sh.join(',')};animation:fl 140s linear infinite`;
  const s2 = s.cloneNode(); 
  s2.style.top = '2000px';
  const st = document.createElement('style');
  st.textContent = '@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-2000px)}}';
  document.head.appendChild(st);
  el.appendChild(s); 
  el.appendChild(s2);
})();

// Bootstrap Pipeline Core Initialization
setLanguage('en');
</script>
