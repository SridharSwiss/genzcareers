</style>

      `ఉపచేతన మనస్సును సానుకూలంగా ఉంచడం ద్వారా అద్భుతాలు చేయవచ్చు. రాత్రి పడుకునే ముందు మీ విజయాలను ఊహించుకోండి. <b>ముఖ్య విశ్లేషణ:</b> మీ అంతర్గత భయాలను తొలగించి, సమృద్ధి (Abundance) మైండ్‌సెట్ ని అలవాటు చేసుకోవడం విజయానికి తిరుగులేని మార్గం.`,
      `సోషల్ మీడియా, అనవసరపు పరధ్యానాలను తగ్గించుకుని ఏకాగ్రతను పెంచుకోవాలి. దృష్టి కేంద్రీకరణే మీ ఆస్తి. <b>ముఖ్య విశ్లేషణ:</b> హై-వాల్యూ పనులు చేసేటప్పుడు నోటిఫിക്കేషన్లు ఆఫ్ చేయండి. మీ అటెన్షన్ ని ఇతరుల కోసం వృథా చేయకండి.`,
      `నలుగురితో సత్సంబంధాలను ఏర్పరచుకోవడం, ఇతరులు చెప్పేది శ్రద్ధగా వినడం ద్వారా సమాజంలో మంచి నెట్‌వర్క్ ఏర్పడుతుంది. <b>ముఖ్య విశ్లేషణ:</b> కేవలం మీ స్వార్థం కోసం కాకుండా, ఇతరుల ఎదుగుదలకు కూడా సహాయపడేలా మీ సంబంధాలను బలోపేతం చేసుకోండి.`,
      `కేవలం కష్టపడి పనిచేయడం వల్ల ఫలితం ఉండదు. దానికి సరైన వ్యూహం, స్మార్ట్ వర్క్, లేదా సిస్టమ్స్ తోడవ్వాలి. <b>ముఖ్య విశ్లేషణ:</b> తక్కువ శ్రమతో ఎక్కువ ఫలితాన్ని ఇచ్చే 80/20 సూత్రాన్ని లేదా డిజిటల్ లెవరేజ్ ని మీ పనుల్లో ఉపయోగించండి.`,
      `ఎంత ఎదిగినా నైతిక విలువలు, మానవత్వం కోల్పోకూడదు. నిజమైన విజయం సమాజానికి ఉపయోగపడేలా ఉండాలి. <b>ముఖ్య విశ్లేషణ:</b> కేవలం భౌతిక సంపదతోనే ఆగకుండా, అంతర్గత ప్రశాంతతను మరియు సమాజంలో మంచి గుర్తింపును సాధించండి.`
    ]

    {n:8, title:"అతి ప్రభావశీల వ్యక్తుల 7 అలవాట్లు", author:"స్టీఫెన్ కోవే", year:"1989", core:"విజయవంతమైన జీవితం కోసం అంతర్గత క్యారెక్టర్‌ను మార్చే ఏడు ముఖ్యమైన అలవాట్ల విశ్లేషణ."},
    {n:9, title:"మీ ఉపచేతన మనస్సు యొక్క शक्ति", author:"జోసెఫ్ మర్ఫీ", year:"1963", core:"ఉపచేతన మనస్సును సానుకూలంగా రీప్రోగ్రామ్ చేయడం ద్వారా ఆరోగ్యం, సంపద మరియు విజయం సాధించవచ్చు."},
    {n:10, title:"ప్రస్తుత క్షణపు శక్తి (The Power of Now)", author:"ఎకార్ట్ టోల్లే", year:"1997", core:"గతాన్ని, భవిష్యత్తును వీడి ప్రస్తుత క్షణంలో బతకడమే సర్వ దుఃఖాలకు నివారణ మరియు నిజమైన శాంతి."},
    {n:11, title:"సన్యాసిగా మారిన కోటీశ్వరుడు", author:"రాబిన్ శర్మ", year:"1997", core:"భౌతిక సంపదతో పాటు అంతర్గత ఆధ్యాత్మిక ప్రశాంతతను ఎలా సాధించాలో తెలిపే కథా రూపక పుస్తకం."},
    {n:12, title:"నువ్వు కూడా గెలవగలవు (You Can Win)", author:"శివ్ ఖేరా", year:"1998", core:"సానుకూల దృక్పథం, ఆత్మవిశ్వాసం మరియు సరైన లక్ష్యాల ద్వారా సామాన్యులు కూడా అసాధారణ విజయాలు సాధించగలరు."},
    {n:13, title:"ఇకిగాయ్ (Ikigai)", author:"హెక్టర్ గార్సియా", year:"2016", core:"జపాన్ దేశస్థుల సుదీర్ఘ, సంతోషకరమైన జీవిత రహస్యమైన 'జీవన పరమార్థం' గురించిన వివరణ."},
    {n:14, title:"సైకాలジー ఆఫ్ మニー", author:"మోర్గాన్ హౌసెల్", year:"2020", core:"డబ్బుతో మనం ఎలా ప్రవర్తిస్తామనేది మనకు ఎంత గణితం తెలుసనే దానికంటే చాలా ముఖ్యం."},
    {n:15, title:"గెలుపు పిలుపు", author:"బి. వి. పట్టాభిరామ్", year:"2008", core:"యువత తమ కెరీర్ లో ఎదురయ్యే సవాళ్లను దాటి విజయం వైపు ఎలా అడుగులు వేయాలో నేర్పే గైడ్."},
    {n:16, title:"విజయం వైపు పయనం", author:"యండమూరి వీరేంద్రనాథ్", year:"1995", core:"విద్యార్థులు, నిరుద్యోగులు తమ అంతర్గత శక్తులను గుర్తించి సమాజంలో ఎలా ఎదగాలి అనే అంశాల విశ్లేషణ."},
    {n:17, title:"గ్రిట్ (Grit)", author:"ఆंజెలా డక్‌వర్త్", year:"2016", core:"విజయానికి కేవలం ప్రతిభే కాదు, పట్టుదల మరియు నిరంతర శ్రమ (Grit) అత్యంత అవసరమని నిరూపించే పుస్తకం."},
    {n:18, title:"ఆల్కెమిస్ట్ (The Alchemist)", author:"పాలో కోయెల్హో", year:"1988", core:"మన కలలను నిజం చేసుకునే ప్రయాణంలో ప్రకృతి సంకేతాలను ఎలా అర్థం చేసుకోవాలో తెలిపే అద్భుత నవల."},
    {n:19, title:"నాల్గు ఒప్పందాలు (The Four Agreements)", author:"డాన్ మిగుల్ రూయిజ్", year:"1997", core:"వ్యక్తిగత స్వేచ్ఛ మరియు ఆనందం కోసం ప్రాచీన టోల్టెక్ సంస్కృతి అందించిన నాలుగు సూత్రాలు."},
    {n:20, title:"కాలజ్ఞానం (Time Management)", author:"స్థానిక నిపుణులు", year:"2010", core:"సమయాన్ని వృథా చేయకుండా ఉత్పాదకతను ఎలా పెంచుకోవాలో తెలిపే కాల నిర్వహణ సూత్రాలు."},
    {n:21, title:"ఆత్మ సాక్షాత్కారం", author:"పరమహంస యోగానంద", year:"1946", core:"భారతీయ యోగ విజ్ఞానం, ఉపచేతన మనస్సును మించిన ఆత్మ శక్తి యొక్క ప్రాముఖ్యతను తెలిపే గ్రంథం."},
    {n:22, title:"కర్మ (Karma)", author:"సద్గురు జగీ వాసుదేవ్", year:"2021", core:"కర్మ అంటే కేవలం గతం కాదు, అది మీ జీవితాన్ని మీ చేతుల్లోకి తీసుకునే బాధ్యత అని వివరించే పుస్తకం."},
    {n:23, title:"5 AM క్లబ్", author:"రాబిన్ శర్మ", year:"2018", core:"ఉదయం 5 గంటలకే నిద్రలేచి మొదటి గంటను మీ ఆత్మవిమర్శకు, ఎదుగుదలకు కేటాయించడం ద్వారా అద్భుతాలు చేయవచ్చు."},
    {n:24, title:"మీ జీవితాన్ని మీరే సరిదిద్దుకోండి", author:"లూయిస్ హే", year:"1984", core:"సానుకూల ఆలోచనలు మరియు స్వీయ ప్రేమ ద్వారా శారీరక, మానసిక రుగ్మతలను నయం చేసుకోవచ్చు."},
    {n:25, title:"నెగటివ్ థింకింగ్ వదిలేయండి", author:"నిక్ ట్రెంటన్", year:"2021", core:"ఓవర్‌థింకింగ్ మరియు అనవసరపు ఆందోళనల నుండి మైండ్‌ను ఎలా విముక్తం చేయాలో తెలిపే పుస్తకం."},
    {n:26, title:"సంపూర్ణ విజయం", author:"యండమూరి వీరేంద్రనాథ్", year:"2002", core:"వ్యక్తిగత వికాసంలోని అన్ని కోణాలను స్పృశిస్తూ సమగ్ర విజయ సాధనకు మార్గదర్శి."},
    {n:27, title:"కాలం మీ చేతుల్లో", author:"బి. వి. పట్టాభిరామ్", year:"2011", core:"సమయాన్ని మేనేజ్ చేయడం అంటే గడియారాన్ని చూడటం కాదు, మీ ప్రాధాన్యతలను నియంత్రించడం అని చెప్పే పుస్తకం."},
    {n:28, title:"అన్-టెథర్డ్ సోల్", author:"మైకేల్ సింగర్", year:"2007", core:"మీ లోపల వినిపించే నిరంతర భయాందోళనల వాయిస్ నుండి మిమ్మల్ని మీరు ఎలా వేరు చేసుకోవాలో తెలిపే గ్రంథం."},
    {n:29, title:"సంకల్ప శక్తి", author:"స్వదేశీ సంకలనం", year:"2014", core:"దృఢమైన సంకల్పం ఉంటే ఎంతటి కష్టమైన పనైనా సులభంగా ఎలా ప్రయాణించవచ్చో వివరించే పుస్తకం."},
    {n:30, title:"అపరిమిత శక్తులు", author:"టోనీ రాబిన్స్", year:"1986", core:"విజయవంతమైన వ్యక్తుల బాడీ లాంగ్వేజ్, ఆలోచనలను మోడలింగ్ చేయడం ద్వారా అదే ఫలితాలు సాధించవచ్చు."},
    {n:31, title:"స్నేహితులను సంపాదించడం ఎలా", author:"డేల్ కార్నెగీ", year:"1936", core:"నలుగురితో సత్సంబంధాలను ఏర్పరచుకోవడం, ఇతరులను ప్రభావితం చేయడం ఎలాగో నేర్పే సార్వజనీన గ్రంథం."},
    {n:32, title:"అపజయం నుండి విజయానికి", author:"వివిధ రచయితలు", year:"2009", core:"గొప్ప వ్యక్తుల జీవితాల్లో ఎదురైన పరాజయాలు, వాటి నుండి వారు నేర్చుకున్న పాఠాల సమాహారం."},
    {n:33, title:"డిజిటల్ మినిమలిజం", author:"కాల్ న్యూపోర్ట్", year:"2019", core:"సోషల్ మీడియా, స్మార్ట్‌ఫోన్ ల యుగంలో మన దృష్టిని కాపాడుకుంటూ ప్రశాంతంగా ఎలా ఉండాలో తెలిపే గైడ్."},
    {n:34, title:"డీప్ వర్క్ (Deep Work)", author:"కాల్ న్యూపోర్ట్", year:"2016", core:"పరధ్యానం లేని ఏకాగ్రతతో పనిచేయడం అనేది ఆధునిక కాలంలో ఒక సూపర్ పవర్ అని నిరూపించే పుస్తకం."},
    {n:35, title:"ఎస్సెంషియలిజం (Essentialism)", author:"గ్రెగ్ మెక్‌కీన్", year:"2014", core:"అన్ని పనులూ చేయడం మాని, కేవలం అత్యంత ముఖ్యమైన కొన్ని పనులపైనే దృష్టి పెట్టడం అలవాటు చేసుకోవాలి."},
    
    // ADJUSTED PROPERTY (ITEM #36): replaced 'cat' with 'author' configuration directly
    {n:36, title:"కాంపౌండ్ ఎఫెక్ట్", author:"డారెన్ హార్డీ", year:"2010", core:"చిన్న చిన్న సానుకూల నిర్ణయాలు నిరంతరాయంగా తీసుకుంటే, కాలక్రమేణా అవి ఊహించని పెద్ద విజయాలను ఇస్తాయి."},
    
    {n:37, title:"మ్యాజిక్ ఆఫ్ థింకింగ్ బిగ్", author:"డేవిడ్ స్క్వార్ట్జ్", year:"1959", core:"మీ ఆలోచనల పరిమాణమే మీ విజయ పరిమాణాన్ని నిర్ణయిస్తుంది. ఎప్పుడూ పెద్దగా ఆలోచించడం ప్రాక్టీస్ చేయండి."},
    {n:38, title:"మీరే ఒక అద్భుతం", author:"జెన్ సిన్సెరో", year:"2013", core:"మిమ్మల్ని మీరే తక్కువ అంచనా వేసుకోవడం ఆపి, మీలోని అపరిమిత శక్తులను ప్రపంచానికి పరిచయం చేయండి."},
    {n:39, title:"ఆలోచనా సరళి (Mindset)", author:"కరోల్ డ్వек", year:"2006", core:"ఫిక్స్‌డ్ మైండ్‌సెట్ నుండి గ్రోత్ మైండ్‌సెట్ వైపు మారడం ద్వారానే మనిషి మేధస్సు అభివృద్ధి chewందుతుంది."},
    {n:40, title:"ది సింపుల్ పాత్ టు వెల్త్", author:"జెఎల్ కాలిన్స్", year:"2016", core:"డబ్బును ఇన్వెస్ట్ చేయడానికి క్లిష్టమైన సూత్రాలు అవసరం లేదు, ఇండెక్స్ ఫండ్స్ లో క్రమం తప్పకుండా పొదుపు చేస్తే చాలు."},
    {n:41, title:"ది మిలియనీర్ నెక్స్ట్ డోర్", author:"థామస్ స్టాన్లీ", year:"1996", core:"నిజమైన కోటీశ్వరులు ఆడంబరాలకు దూరంగా, చాలా సాధారణ జీవితాన్ని గడుపుతూ సంపదను పెంచుకుంటారు."},
    {n:42, title:"ది రిచెస్ట్ మాన్ ఇన్ బాబిలాన్", author:"జార్జ్ క్లాసన్", year:"1926", core:"పురాతన బాబిలాన్ కథల ద్వారా పొదుపు, పెట్టుబడి యొక్క ప్రాథమిక సూత్రాలను నేర్పే క్లాసిక్ పుస్తకం."},
    {n:43, title:"యువర్ మనీ ఆర్ యువర్ లైఫ్", author:"విక్కీ రాబిన్", year:"1992", core:"డబ్బు అనేది కేవలం కరెన్సీ కాదు, అది మీరు ఆ డబ్బు సంపాదించడానికి కేటాయించిన మీ జీవిత కాలం."},
    {n:44, title:"ది టోటల్ మనీ మేకోవర్", author:"డేవ్ రామ్సే", year:"2003", core:"అప్పుల నుండి పూర్తిగా విముక్తి పొంది, ఆర్థిక స్థిరత్వాన్ని సాధించడానికి ఏడు సులువైన అడుగుల ప్రణాళిక."},
    {n:45, title:"నవల్ రవికాంత్ ఆల్మనాక్", author:"ఎరిక్ జోర్గెన్సన్", year:"2020", core:"ఆధునిక యుగంలో సంపద సృష్టి మరియు సంతోషకరమైన జీవితం కోసం అవసరమైన స్పష్టమైన ఆలోచనల సమాహారం."},

let currentLang = 'en';
let idx = 0;

function buildLocalizedBook(registryItem, langCode) {
  const dict = CONFIG[langCode];
  
  let processedConcepts = [];
  for(let i=0; i<10; i++) {
    processedConcepts.push({
      h: `${registryItem.title} · ${dict.concepts[i]}`,
      p: dict.texts[i]
    });
  }

  return {
    n: registryItem.n,
    title: registryItem.title,
    author: registryItem.author,
    year: registryItem.year,
    cat: dict.cats[Math.floor((registryItem.n - 1) / 17)] || dict.cats[0],
    core: registryItem.core,
    concepts: processedConcepts,
    sig: `${dict.sigSuffix}`
  };
}

let BOOKS = [];

function setLanguage(langCode) {
  currentLang = langCode;
  
  const rawList = BOOK_DATASETS[currentLang];
  BOOKS = rawList.map(item => buildLocalizedBook(item, currentLang));
  
  const dict = CONFIG[currentLang];
  document.getElementById('libTitle').innerHTML = dict.appTitle;
  document.getElementById('contentsBtn').innerText = dict.indexBtn;
  document.getElementById('indexHeading').innerText = dict.indexHead;
  document.getElementById('closeOv').innerText = dict.closeBtn;
  document.getElementById('prev').innerText = dict.prevBtn;
  document.getElementById('next').innerText = dict.nextBtn;
  document.getElementById('navigationHint').innerText = dict.hint;
  
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.id === `btn-lang-${langCode}`);
  });

  rebuildIndexGrid();
  render();
}

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const pfill = document.getElementById('pfill');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const grid = document.getElementById('grid');

// Null-Safe String Escaper to Prevent Script Failures
function esc(s){
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const b = BOOKS[idx];
  const num = String(b.n).padStart(2,'0');
  const dict = CONFIG[currentLang];
  
  const conceptsHTML = b.concepts.map((c,i)=>`
    <li style="animation-delay:${0.04 + i*0.02}s">
      <span class="mk">◆</span>
      <div>
        <h4>${esc(c.h)}</h4>
        <p>${c.p}</p>
      </div>
    </li>`).join('');

  stage.innerHTML = `
    <div class="book">
      <aside class="book-left">
        <div class="emblem">
          <div class="ring"></div>
          <div class="ring spin"></div>
          <div class="ring r2"></div>
          <div class="bignum">${num}</div>
        </div>
        <div class="cat">${esc(b.cat)}</div>
      </aside>
      <div class="book-main">
        <h1 class="b-title">${esc(b.title)}</h1>
        <div class="b-meta">${dict.authorLbl}: <b>${esc(b.author)}</b> &nbsp;·&nbsp; ${dict.yearLbl}: ${b.year}</div>
        <div class="core">
          <span class="lbl">${dict.coreLbl}</span>
          <p>${esc(b.core)}</p>
        </div>
        <ul class="concepts">${conceptsHTML}</ul>
        <div class="signature" style="animation-delay:${0.1 + b.concepts.length*0.02}s">
          <span class="lbl">${dict.principleLbl}</span>
          <p>“${esc(b.sig)}”</p>
        </div>
      </div>
    </div>`;

  counter.innerHTML = `<b>${num}</b> / 50`;
  pfill.style.width = ((b.n)/50*100)+'%';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === BOOKS.length - 1;
  
  document.querySelector('main').scrollTop = 0;
  updateGridActiveStates();
}

function rebuildIndexGrid() {
  grid.innerHTML = BOOKS.map((b,i)=>`
    <button class="gcard" data-i="${i}" onclick="jump(${i})">
      <span class="gn">${String(b.n).padStart(2,'0')}</span>
      <span class="gt">${esc(b.title)}<span class="ga">${esc(b.author)}</span></span>
    </button>`).join('');
}

function go(d){ 
  const t = idx + d; 
  if(t >= 0 && t < BOOKS.length){ idx = t; render(); } 
}

function jump(i){ 
  idx = i; 
  render(); 
  closeOverlay(); 
}

function updateGridActiveStates(){
  grid.querySelectorAll('.gcard').forEach((c,i) => c.classList.toggle('active', i === idx));
}

prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);

addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'Escape') closeOverlay();
});

let tx = 0;
addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx; 
  if(Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive:true});

const overlay = document.getElementById('overlay');
document.getElementById('contentsBtn').onclick = () => {
  overlay.classList.add('open');
  updateGridActiveStates();
};

document.getElementById('closeOv').onclick = closeOverlay;
function closeOverlay(){ overlay.classList.remove('open'); }

(function(){
  const el = document.querySelector('.stars'); 
  let sh = [];
  for(let i=0; i<140; i++){
    sh.push(`${Math.floor(Math.random()*2000)}px ${Math.floor(Math.random()*2000)}px rgba(246,227,168,${0.25 + Math.random()*0.65})`);
  }
  const s = document.createElement('div');
  s.style.cssText = `position:absolute;width:1.2px;height:1.2px;border-radius:50%;box-shadow:${sh.join(',')};animation:fl 140s linear infinite`;
  const s2 = s.cloneNode(); 
  s2.style.top = '2000px';
  const st = document.createElement('style');
  st.textContent = '@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-2000px)}}';
  document.head.appendChild(st);
  el.appendChild(s); 
  el.appendChild(s2);
})();

setLanguage('en');
