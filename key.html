<style>

    --void:#030509; --void-2:#070a15;
    --gold:#e8c879; --gold-bright:#f6e3a8; --gold-deep:#b8902f;
    --ember:#c25b3f; --cream:#efe7d4; --cream-dim:#bcb29a;

  }

  html,body{height:100vh;height:100dvh;overflow:hidden}
  body{
    background:var(--void); color:var(--cream);
    font-family:'Noto Sans', 'Noto Sans Telugu', sans-serif; position:relative;
  }
  .nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 50% at 15% 10%, rgba(55,35,115,0.22), transparent 60%),
      radial-gradient(ellipse 50% 60% at 85% 25%, rgba(184,144,47,0.10), transparent 60%),

  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.04;mix-blend-mode:overlay;

  #app{
    position:relative;z-index:3;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
  }

  /* Immersion-Aware Transition Timings System */
  .hide-ui .bar { transform: translateY(-100%); opacity: 0; pointer-events: none; }
  .hide-ui .controls, .hide-ui .lib-footer { transform: translateY(100%); opacity: 0; pointer-events: none; }
  .bar, .controls, .lib-footer { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease; }

  .bar{
    display:flex;flex-direction:column;align-items:center;
    padding:0.75rem 0.85rem;flex-shrink:0;gap:0.75rem;
    border-bottom:1px solid rgba(232,200,121,0.04);
    background:rgba(3,5,9,0.3); width:100%;
  }
  @media(min-width:850px){
    .bar{flex-direction:row;justify-content:space-between;padding:1rem clamp(1.1rem,4vw,2.6rem);gap:1.5rem}
  }
  
  .lib-title{
    font-family:'Cinzel', serif;font-weight:600;letter-spacing:.08em;
    font-size:clamp(0.8rem,3.5vw,0.95rem);color:var(--gold);text-transform:uppercase;
    text-align:center;width:100%;
  }
  @media(min-width:850px){.lib-title{width:auto;text-align:left;letter-spacing:.12em;font-size:1rem}}
  .lib-title span{color:var(--cream-dim);font-weight:400;letter-spacing:.05em}
  
  .lang-selector{
    display:flex;gap:0.4rem;align-items:center;width:100%;
    justify-content:center;flex-wrap:nowrap;
  }
  @media(min-width:850px){.lang-selector{width:auto;gap:0.5rem}}
  
  .lang-btn{
    flex:1 1 0%; text-align:center;
    background:rgba(232,200,121,0.02); border:1px solid var(--line); color:var(--cream-dim);
    font-size:0.72rem;padding:0.45rem 0.2rem;cursor:pointer;border-radius:4px;font-weight:700;
    transition:all 0.2s ease;font-family:inherit;white-space:nowrap;
  }
  @media(min-width:850px){.lang-btn{flex:none;width:auto;padding:0.4rem 1.1rem;font-size:0.75rem}}
  .lang-btn:hover{border-color:var(--gold);color:var(--cream);background:rgba(232,200,121,0.06)}
  .lang-btn.active{
    background:var(--gold-deep) !important; color:var(--void) !important;
    border-color:var(--gold-bright) !important; font-weight:700; box-shadow:0 0 14px -2px var(--glow);
  }

  .bar-right{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;gap:1rem;flex-wrap:nowrap;
  }
  @media(min-width:850px){.bar-right{width:auto;justify-content:flex-end;gap:1.5rem}}
  
  .counter{font-family:'Cinzel', serif;font-size:.82rem;letter-spacing:.12em;color:var(--cream-dim);white-space:nowrap}
  .counter b{color:var(--gold)}
  
  .action-group{display:flex;gap:0.45rem;align-items:center;flex-wrap:nowrap}
  
  .btn{font-family:sans-serif;font-size:.72rem;color:var(--cream);background:transparent;border:1px solid var(--line);
    padding:.45rem 0.75rem;border-radius:4px;cursor:pointer;transition:all .3s;white-space:nowrap}
  @media(min-width:850px){.btn{padding:.45rem 1.1rem;font-size:.75rem}}
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);box-shadow:0 0 18px -6px var(--glow)}
  
  #speakBtn.reading-active {
    background: var(--ember) !important; color: var(--cream) !important;
    border-color: var(--cream) !important; animation: pulseGlow 2s infinite ease-in-out;
  }

    0%, 100% { box-shadow: 0 0 4px rgba(194,91,63,0.3); }
    50% { box-shadow: 0 0 16px rgba(194,91,63,0.6); }
  }

  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright));
    width:2%;transition:width .4s ease;box-shadow:0 0 12px var(--glow)}

  main{
    flex:1;display:flex;align-items:flex-start;justify-content:center;
    padding:clamp(1rem,3vh,2.5rem) clamp(0.85rem,5vw,4rem);
    overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;

  .book{display:grid;grid-template-columns:clamp(190px,24%,280px) 1fr;gap:clamp(1.5rem,5vw,4.5rem);
    max-width:1200px;width:100%;align-items:start}

  }
  .emblem{position:relative;width:clamp(120px,16vw,190px);height:clamp(120px,16vw,190px);

    border-bottom-color:transparent;border-left-color:transparent;animation:spin 16s linear infinite}

  .bignum{font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700;
    font-size:clamp(1.8rem,5vw,3.5rem);color:var(--gold);line-height:1;text-shadow:0 0 25px var(--glow)}

  .b-title{font-weight:700;line-height:1.25;font-size:clamp(1.35rem,3.5vw,2.2rem);color:var(--cream);margin-bottom:.5rem}
  .b-meta{font-size:.82rem;letter-spacing:.05em;color:var(--gold-deep);margin-bottom:1.5rem}
  .b-meta b{color:var(--gold);font-weight:500}
  .lbl{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
  .lbl::before{content:"";width:20px;height:1px;background:var(--gold)}
  .core{margin-bottom:1.8rem}
  .core p{font-size:clamp(1rem,2vw,1.2rem);font-style:italic;color:var(--cream);line-height:1.6;max-width:65ch}

  .concepts{list-style:none;display:grid;gap:1.2rem;margin-bottom:1.8rem}

  .concepts li:last-child{border-bottom:none}

  .concepts h4{font-weight:700;font-size:1.05rem;color:var(--gold-bright);margin-bottom:.3rem}

  .signature p{font-size:clamp(0.95rem,1.8vw,1.15rem);color:var(--gold-bright);line-height:1.5;font-style:italic}

  .controls{
    display:flex;justify-content:space-between;align-items:center;

    background:rgba(3,5,9,0.7);backdrop-filter:blur(8px);border-top:1px solid rgba(232,200,121,0.03);
  }
  .nav-btn{font-size:.78rem;color:var(--cream);background:transparent;border:1px solid var(--line);
    padding:.65rem 1.2rem;border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .nav-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright)}
  .nav-btn:disabled{opacity:.2;cursor:not-allowed}
  .hint{font-size:.78rem;color:rgba(188,178,154,.35);font-style:italic;text-align:center}
  @media(max-width:680px){.hint{display:none}}

  .lib-footer{
    text-align:center;
    padding:0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom));
    font-size:0.7rem;
    color:rgba(188,178,154,0.25);
    background:rgba(3,5,9,0.9);
    flex-shrink:0;
    z-index:4;
    font-family:sans-serif;
    letter-spacing:0.01em;
    line-height:1.4;
  }
  .lib-footer b{color:rgba(232,200,121,0.4);font-weight:500}

  .overlay{position:fixed;inset:0;z-index:100;background:rgba(4,6,12,0.98);backdrop-filter:blur(16px);
    display:none;flex-direction:column;padding:clamp(1rem,4vw,2.6rem);padding-bottom:calc(1rem + env(safe-area-inset-bottom))}

  .ov-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.4rem;flex-shrink:0}

  .gcard .gn{color:var(--gold);font-size:.78rem;flex-shrink:0;min-width:1.5em;font-weight:600}
  .gcard .gt{color:var(--cream);font-size:0.95rem;line-height:1.3}
  .gcard .ga{display:block;font-size:.75rem;color:var(--cream-dim);font-style:italic;margin-top:.1rem}

  .grid::-webkit-scrollbar,main::-webkit-scrollbar{width:4px}
  .grid::-webkit-scrollbar-thumb,main::-webkit-scrollbar-thumb{background:var(--gold-deep);border-radius:10px}
</style>

      document.body.classList.add('hide-ui');

    {n:23, title:"The Millionaire Next Door", author:"Thomas J. Stanley", year:"1996", core:"Real net worth accumulation is driven by lifelong defensive consumption and continuous low-overhead living baselines.", principles:[
      {h:"Net Worth vs High Income",p:"High consumer spending structures simulate wealth but actively prevent net worth accumulation. Wealth is measured by asset equity, not current consumption profiles."},
      {h:"Frugality Baseline Anchoring",p:"The typical real-world millionaire maintains low lifestyle overhead, operates reliable pre-owned vehicles, and rejects prestige neighborhood traps cleanly."},
      {h:"PAW vs UAW Matrix Positions",p:"Prodigious Accumulators of Wealth (PAWs) maximize net worth multipliers relative to age/income benchmarks; Under Accumulators (UAWs) convert revenue entirely into depreciating status goods."},

      {h:"Sovereignty Over Status",p:"Value absolute calendar freedom and corporate non-dependence over shiny depreciating consumer metals. True power is walking away whenever you choose."}
    ], sig:"Wealth is more often the result of a lifestyle of hard work, perseverance, economy, and self-discipline."},
    {n:24, title:"The Richest Man in Babylon", author:"George S. Clason", year:"1926", core:"Timeless wealth creation rules require paying yourself first, securing expert counsel, and force-multiplying investment offspring.", principles:[
      {h:"Purse Fattening Baselines",p:"Isolate a minimum of exactly 10% of total revenue streams on payday. This capital belongs entirely to your future asset column; do not spend it on overhead."},
      {h:"Expense Control Filters",p:"Overhead requirements naturally expand to completely devour untracked income loops. Draw firm boundaries separating bare life necessities from casual lifestyle desires."},

      {h:"Principal Capital Shielding",p:"Guard your saved principal capital from speculative risk profiles and enticing high-return illusions. Prioritize return *of* capital over speculative return *on* capital lines."},

    ], sig:"A part of all you earn is yours to keep. Pay yourself first."},
    {n:25, title:"Your Money or Your Life", author:"Vicki Robin", year:"1992", core:"Money represents a direct trade of your finite, irreplaceable life-force energy. Treat every purchase as a cost of hours lived.", principles:[
      {h:"Life-Force Currency Definition",p:"Money is simply an intermediate token representing your limited physical life-energy traded away at work. Calculate transactions in hours, not dollars."},
      {h:"Real Hourly Wage Audits",p:"Subtract commuting costs, work-wardrobe overhead, decompression expenses, and taxes from net revenue to identify the true sub-par hourly rate you earn."},
      {h:"Fulfillment Curve Optimization",p:"Plot consumption points. Capital spent boosts joy through survival and comfort parameters, but past an optimal threshold, extra spending yields stress and clutter clutter."},
      {h:"Penny Ledger Tracing",p:"Establish a non-negotiable written registry of every micro-cent entering or exiting your framework. Consciousness completely dissolves unconscious habit leaks."},

      {h:"Desire Threshold Compression",p:"Minimize material desires intentionally. Reducing your dependency on external goods is an exponentially more stable path to freedom than endlessly inflating income lines."},

    ], sig:"We do not make a living at work; we trade our precious life energy away for money."},
    {n:26, title:"The Total Money Makeover", author:"Dave Ramsey", year:"2003", core:"Eradicate personal financial risk by executing an aggressive, linear process sequence to permanently destroy debt liabilities.", principles:[
      {h:"Debt Tool Myth Extermination",p:"Debt is not a leverage asset for consumers; it is a dangerous financial anchor that siphons away cash flow options and personal peace of mind."},
      {h:"The Starter Shield Buffer",p:"Stack $1,000 cash in an isolated reserve immediately before attacking debt pipelines to absorb minor real-world friction emergencies safely."},
      {h:"The Debt Snowball Funnel",p:"List consumer liabilities strictly by balance size. Kill the smallest first with maximum aggressive force while holding minimums elsewhere to lock psychological momentum wins."},
      {h:"The Bulletproof Emergency Shield",p:"Once consumer debt hits absolute zero, expand cash reserves to cover 3-6 months of real lifestyle overhead expenses to eliminate macro panic vulnerabilities."},

    ], sig:"If you will live like no one else, later you can live like no one else."},
    {n:27, title:"The Almanac of Naval Ravikant", author:"Eric Jorgenson", year:"2020", core:"Building true wealth requires leveraging unique specific knowledge, scaling via code or media, and practicing optimal judgment metrics.", principles:[

      {h:"Specific Knowledge Tracking",p:"Locate the authentic intersection of tasks that came naturally to your teenage brain. Lean heavily into your unique fascination vectors to build irreplaceable value."},
      {h:"Modern Media Code Leverage",p:"Master permissionless leverage: software code and digital media scale infinitely with zero replication costs and require no human permission loops to work 24/7 globally."},
      {h:"Judgment Currency Prioritization",p:"In a highly leveraged economy, one optimal strategic choice matters infinitely more than 80 hours of raw manual grind labor. Protect your mental clarity maps fiercely."},
      {h:"Internal Hourly Pricing Rules",p:"Establish a high internal value price tag (e.g., $300/hr) and ruthlessly outsource or skip any daily task tracking below that baseline parameter boundary."},

      {h:"Sell-Build Core Conjunction",p:"If you can learn to build assets and learn to sell assets simultaneously, you become an unstoppable, undisputed market force with unlimited equity options."},

      {h:"Peace as Wealth Optimization",p:"Static figures on an investment tracking matrix are meaningless if your interior mind is chaotic. Prioritize health and emotional calm as your baseline wealth metric."}
    ], sig:"Seek wealth, not money or status. Wealth is having assets that earn for you while you sleep."},
    {n:28, title:"The Millionaire Fastlane", author:"MJ DeMarco", year:"2011", core:"Reject traditional 40-year mutual fund accumulation advice; launch high-leverage business system architectures to unlock rapid wealth scale.", principles:[
      {h:"The Primary Wealth Triad",p:"True wealth lives at the solid intersection of three pillars: profound human Relationships, vibrant physical Health, and absolute control over Time assets."},
      {h:"Fastlane System Shift Choices",p:"The Sidewalk consumes instantly; the Slowlane trades 40 prime years for retirement; the Fastlane creates scalable producer-centric business system machines now."},
      {h:"The Effection Equation Matrix",p:"The volume of wealth you accumulate matches mathematically with the exact net magnitude and scale of the marketplace problems you solve for human beings."},
      {h:"The Commandment of Entry",p:"Avoid highly crowded spaces with low entry thresholds (like multi-level marketing setups). High-value asset pipelines demand deep barriers to entry to prevent competition dilution."},
      {h:"The Commandment of Need",p:"Stop building business ideas based on personal passions. The market prioritizes its own pain loops and frustrations exclusively. Find a friction point and fix it."},
      {h:"The Commandment of Time Separations",p:"Your business infrastructure must operate completely decoupled from your physical labor hours to yield wealth. Build products or digital assets that transact autonomously."},
      {h:"The Commandment of Scale",p:"Ensure your business system targets a massive, global addressable marketplace. Local geographic boundaries cap your compound potential; digital scale provides infinite return possibilities."},

      {h:"Debt Acceleration Restrictions",p:"Wipe consumer credit debt out with absolute zero-tolerance focus. Utilize financial leverage exclusively to expand asset production lines and scale corporate system reach safely."}
    ], sig:"To sell to millions, you must look at the world through the eyes of a producer, not a consumer."},
    {n:29, title:"Secrets of the Millionaire Mind", author:"T. Harv Eker", year:"2005", core:"Your financial destiny is dictated entirely by a subconscious money thermostat installed during your primary childhood conditioning years.", principles:[
      {h:"Thermostat Blueprint Awareness",p:"Subconscious childhood conditioning runs your financial defaults automatically. Identify and overwrite these scripts to permanently lift your generation threshold filters."},
      {h:"The Manifestation Loop upstream",p:"Thoughts map into Feelings, Feelings generate Actions, and Actions deliver your lived Results. Go upstream: fix the thoughts to automatically alter the results metrics."},
      {h:"Sovereign Life Belief Anchors",p:"Rich minds choose to believe 'I build my economic life'; poor minds default to believing 'Life happens to me'. Ban all victimhood language instantly."},
      {h:"Self-Promotion Pride Settings",p:"If you genuinely believe your product or service asset solves a complex problem for people, it is your absolute moral duty to promote it with high passion lines."},
      {h:"Obstacle Scale Transcending",p:"Success metrics don't require problem-free roads. Grow your individual leadership and strategic capacity so you are mathematically larger than any incoming operational hurdle."},
      {h:"Receivership Channel Openings",p:"Shatter subterranean guilt loops or worthiness blocks that cause your framework to subconsciously reject or sabotage large financial inflows. Open the valves wide safely."},

    ], sig:"If your subconscious money blueprint is not set for success, nothing you learn will make a bit of difference."},
    {n:30, title:"Die with Zero", author:"Bill Perkins", year:"2020", core:"The ultimate objective of financial management is to optimize the lifetime distribution of capital across unforgettable experience assets.", principles:[
      {h:"Life-Curve Resource Allocation",p:"Stop mindlessly hoarding capital for extreme old age. Strategically spend and distribute resources across your active life curve to maximize experiential fulfillment indices."},
      {h:"Memory Dividend Assets",p:"Investing in an extraordinary experience early generates a continuous emotional dividend loop that pays returns every single time you recall it across your lifetime grid."},
      {h:"Health-Wealth Intersection realities",p:"Biological capacity to enjoy experiences decays predictably with aging parameters. Execute intense travel and high-energy milestones in your 20s and 30s while your container is optimal."},

      {h:"Adequacy Survival Benchmarking",p:"Calculate your precise economic survival threshold needed for safe automated old age care. Once that numerical score is secured, convert labor hours back into time options."},

    {n:31, title:"The Simple Path to Wealth", author:"JL Collins", year:"2016", core:"Eradicate investment complexity: live substantially below your means and automate all capital inflows into broad stock index funds.", principles:[
      {h:"Freedom Shield Capital Foundations",p:"Accumulate a robust cash cushion to act as unyielding 'F-You Money'. This insulation gives you the power to decline toxic work settings seamlessly."},
      {h:"The Alpha Index Asset",p:"Route your capital reserves directly into low-cost, total stock market index tracking structures (like VTSAX) to automatically capture global wealth generation waves."},
      {h:" Relentless Upward Vector Maps",p:"Despite catastrophic short-term market crashes, the long-term vector of diversified capitalism moves relentlessly upward over multi-decade tracking timelines. Stay calm."},

    {n:32, title:"Cashflow Quadrant", author:"Robert T. Kiyosaki", year:"2000", core:"True financial liberation requires moving execution parameters from the left side of the quadrant (E/S) onto the automated right side (B/I).", principles:[

      {h:"The S vs B Structural Disconnect",p:"S quadrant solo operators own a specialized job and are the critical engine. B quadrant leaders design automated business system machines that function without them."},

      {h:"Security vs Freedom Paradigms",p:"Employees trade lifelong compliance for the illusion of job security. Systems builders embrace calculation risks to claim total uncompromised time sovereignty lines."},
      {h:"Internal Value System Shifts",p:"Transitioning quadrants demands overhauling your internal baseline identity, risk tolerance parameters, and default conditioning maps. Clear out your old employee loops."},

      {h:"Accounting Tax Literacy Shields",p:"Understanding balance sheets, tax breaks, and legal corporate write-offs provides the ultimate defensive armor shield to protect cash generation arrays from systemic bleeding."}
    ], sig:"The left side trades time for money. The right side builds systems and assets that generate freedom."},
    {n:33, title:"Unshakeable", author:"Tony Robbins", year:"2017", core:"Construct a recession-proof wealth engine by automating index fund allocations and mastering your psychology during market storms.", principles:[
      {h:"Correction Patterns Mapping",p:"Market corrections happen once a year on average. 80% of these never escalate into bear markets. Volatility is simply a normal performance tax, not a disaster."},
      {h:"The Sidelined Cash Trap",p:"Fearing market dips and hoarding cash on the sidelines frequently causes you to miss the single best performance days of a decade, destroying compounding parameters completely."},
      {h:"Asset Allocation Frameworks",p:"Divide your wealth capital into distinct, rigid buckets: a growth bucket (equities) and a security buffer (cash/bonds) based completely on your real lifecycle timeline."},
      {h:"Predatory Fee Eradication",p:"Standard active mutual funds and hidden broker administration fees silently consume up to 60% of your growth curves over time. Transition into low-cost index tracking nodes."},

      {h:"Sovereign Success Metrics",p:"Accumulating millions on a spreadsheet while living inside continuous anxiety or anger maps is an absolute life execution failure. True wealth is unyielding internal appreciation."}

    {n:34, title:"The Secret", author:"Rhonda Byrne", year:"2006", core:"Your dominant subconscious thoughts act as an unyielding psychological magnet, pulling matching external real-world scenarios into your experience.", principles:[
      {h:"The Magnetic Mind Architecture",p:"Like attracts like. Your cognitive focus operates as a radio broadcast tower, projecting thought frequencies that draw matching circumstances into your immediate environment."},
      {h:"The Creation Formula Sequence",p:"The exact workflow for deliberate manifestation contains three precise steps: Ask with razor clarity, Believe with felsenfest faith, and Receive with gratitude loops."},
      {h:"Gratitude Frequency Shifts",p:"Appreciating your current reality with high intensity resets your internal emotional frequency from lack to abundance, opening structural valves for future growth."},
      {h:"Creative Visualization Drills",p:"Spend 10 minutes daily creating an emotionally charged, rich mental image of your target targets. This primes your brain's search algorithms to notice solutions."},
      {h:"The Abundance Mindset Blueprint",p:"Reject scarcity programming. The universe is a positive-sum field of potential. Another person's success metrics do not subtract from your unique expansion vectors."},
      {h:"Emotion-Infused Directives",p:"A cold, intellectual thought carries zero creative momentum fields. Thoughts must be fully saturated with raw emotional feelings to program the subconscious engine safely."},

    {n:35, title:"The Power of Now", author:"Eckhart Tolle", year:"1997", core:"Human suffering is an illusion generated by complete identification with the frantic analytical mind and the rejection of the present moment.", principles:[
      {h:"The Illusion of Linear Time",p:"The past is simply a collection of old memory traces; the future is an abstract mental projection. The present moment is the only layer where existence ever occurs."},

      {h:"Surrender as Pure Stature",p:"Surrender is not passive defeat; it is the radical, conscious acceptance of the current moment as it objectively is. This neutral baseline opens clean execution paths."},

      {h:"The Gaps of Silence Portal",p:"Notice the silent intervals between sounds and the vast empty spaces around physical objects to cool down your frantic brain processing tracks automatically."},

    {n:36, title:"Ask and It Is Given", author:"Esther & Jerry Hicks", year:"2004", core:"Your emotion engine serves as an active vibrational guidance system designed to help you align directly with the universe's natural flow of abundance.", principles:[

      {h:"Segment Intending Routines",p:"Divide your day into distinct blocks, setting a precise emotional directive before entering each zone: 'In this next slot, I intend to project complete calm.'"},
      {h:"The Pivot Protocol",p:"The exact moment you catch your mind tracking lack metrics (e.g., 'I am broke'), pivot focus immediately to choice states: 'I am actively engineering wealth loops.'"},

      {h:"Action Grind Illusion Splits",p:"Forced, frantic grinding born from fear or desperation yields low-value, exhausting results. Align your interior frequency state first to trigger inspired execution actions."},
      {h:"Vibrational Escrow Assets",p:"The moment you define a target desire, its energetic blueprint is instantly secured in your field. Your sole obligation is to match its frequency until it materializes."},
      {h:"Scripting Journal Drills",p:"Write out an exhaustive present-tense narrative of your ideal future life, capturing the exact sensory details and joy loops as if it is already your lived reality."}
    ], sig:"How you feel is your point of attraction."},
    {n:37, title:"Breaking the Habit of Being Yourself", author:"Joe Dispenza", year:"2012", core:"To permanently change your life conditions, you must systematically override the automated personality scripts neurochemically wired into your physical body.", principles:[
      {h:"Personality Reality Mechanics",p:"Your standard personality consists of exactly how you habitually think, act, and feel daily. Change your automated personality map to alter your personal physical reality."},
      {h:"The Body Mind Loop Prison",p:"When repetitive thoughts loop for decades, the physical body automates those old emotions, overriding conscious design intent. Break the chemical loop via focus control."},
      {h:"Quantum Field Broadcasting",p:"The quantum field responds directly to who you are being—the exact broadcast line generated by matching clear mental thoughts with elevated heart emotions fields."},

    {n:38, title:"Think Like a Monk", author:"Jay Shetty", year:"2020", core:"Claim internal peace and clarity by systematically stripping away social engineering scripts and training your mind for purpose and service.", principles:[

    {n:39, title:"The Alchemist", author:"Paulo Coelho", year:"1988", core:"Every human life holds a unique destiny path; fulfilling it demands reading environmental omens and overriding the fear of failure completely.", principles:[

    {n:41, title:"Manifest: 7 Steps to Living Your Best Life", author:"Roxie Nafousi", year:"2022", core:"Manifestation is a rigorous, actionable framework of self-development requiring extreme target clarity, high self-worth, and real sweat equity.", principles:[

    {n:1, title:"విజయానికి ఐదు మెట్లు", author:"యండమూరి వీరేంద్రనాథ్", year:"1990", core:"విజయం అనేది ఆకస్మికంగా వచ్చేది కాదు; అది క్రమశిక్షణ, వ్యూహం మరియు నిరంతర ఆత్మపరిశీలన ఫలితం.", principles:[
      {h:"1. ఆత్మవిశ్వాసం", p:"మిమ్మల్ని మీరు పూర్తిగా నమ్మడమే విజయానికి పునాది. మీ బలహీనతలను తెలుసుకుని బలాలను పెంచుకోవాలి."},
      {h:"2. లక్ష్య నిర్దేశం", p:"స్పష్టమైన, కొలవదగిన లక్ష్యం లేని జీవితం చుక్కాని లేని నావ లాంటిది. లక్ష్యాలను రాతపూర్వకంగా రాసుకోవాలి."},
      {h:"3. సమయ పాలన", p:"గడచిన కాలం తిరిగి రాదు. రోజువారీ పనులలో అత్యవసరమైన వాటికి, ముఖ్యమైన వాటికి మధ్య తేడా గుర్తించాలి."},
      {h:"4. నిరంతర జ్ఞానార్జన", p:"డిగ్రీలతో చదువు ముగిసిపోదు. ప్రతిరోజూ కొత్త విషయాలు, నైపుణ్యాలు నేర్చుకుంటూ ఉండాలి."},
      {h:"5. వైఫల్యాల నిర్వహణ", p:"ఓటమి ప్రయాణానికి ముగింపు కాదు, అది ఒక పాఠం. తప్పుల నుండి నేర్చుకుని వ్యూహాన్ని మార్చాలి."},
      {h:"6. ఏకాగ్రత పెంపు", p:"మల్టీటాస్కింగ్ భ్రమలను వీడి, ఒక ముఖ్యమైన పని పూర్తయ్యే వరకు వేరే దేనికీ ప్రాధాన్యత ఇవ్వకూడదు."},
      {h:"7. సానుకూల దృక్పథం", p:"పరిస్థితులు ఎలా ఉన్నా, ప్రతి సమస్యలో ఒక అవకాశాన్ని వెతకడం అలవాటు చేసుకోవాలి."},
      {h:"8. ప్రజా సంబంధాలు", p:"మన ఆలోచనలను ఇతరులకు స్పష్టంగా చెప్పగలగడం మరియు ఇతరులు చెప్పేది శ్రద్ధగా వినడం నేర్చుకోవాలి."},
      {h:"9. వ్యూహాత్మక శ్రమ", p:"కేవలం కష్టపడి పనిచేయడం వల్ల ఫలితం ఉండదు. శ్రమకు సరైన స్మార్ట్ వ్యూహం తోడవ్వాలి."},
      {h:"10. నైతిక విలువలు", p:"ఎంత ఎదిగినా మానవత్వం, నైతికత కోల్పోకూడదు. నిజమైన విజయం క్యారెక్టర్ తోనే వస్తుంది."}
    ], sig:"విజయం అనేది ఒక గమ్యం కాదు, అదొక నిరంతర ప్రయాణం మరియు జీవన విధానం."},
    {n:2, title:"మీ మనసే మీ గెలుపు", author:"బి. వి. పట్టాభిరామ్", year:"2005", core:"మానసిక నియంత్రణ, ఆలోచనా విధానాల శుద్ధీకరణే మనిషి యొక్క అంతర్గత మరియు బాహ్య విజయాలను శాసిస్తాయి.", principles:[
      {h:"1. మనస్సు యొక్క శక్తులు", p:"మానవ మనస్సు ఒక శక్తివంతమైన కంప్యూటర్ లాంటిది. దానికి మనం ఇచ్చే ఆలోచనలే ఫలితాలుగా వస్తాయి."},
      {h:"2. ఒత్తిడి నివారణ", p:"శ్వాస ప్రక్రియలు, ధ్యానం ద్వారా మనస్సును ప్రశాంతంగా ఉంచుకోవడం అలవాటు చేసుకోవాలి."},
      {h:"3. జ్ఞాపకశక్తి పెంపు", p:"విషయాలను చిత్రాల రూపంలో (Visual Association) గుర్తుంచుకోవడం ద్వారా మెదడు ఎక్కువ కాలం నిల్వ ఉంచుకుంటుంది."},
      {h:"4. ఆత్మన్యూనత అధిగమించడం", p:"ఇతరులతో పోల్చుకోవడం వల్లే ఆత్మన్యూనత ఏర్పడుతుంది. మీ ప్రత్యేకతను మీరు గుర్తించాలి."},
      {h:"5. అలవాట్ల మార్పు", p:"చెడు అలవాట్లను ఒక్కసారిగా మానేయడం కంటే, వాటి స్థానంలో కొత్త మంచి అలవాట్లను ప్రవేశపెట్టాలి."},
      {h:"6. భావోద్వేగాల నియంత్రణ", p:"కోపం, అసూయ, భయం వంటి భావోద్వేగాలు మన వివేకాన్ని నశింపజేస్తాయి. వాటికి దూరంగా ఉండాలి."},
      {h:"7. తక్షణ స్పందన వద్దు", p:"ఏదైనా సంఘటన జరిగినప్పుడు తక్షణమే స్పందించకుండా, ఒక నిమిషం ఆగి ఆలోచించి సమాధానం ఇవ్వాలి."},
      {h:"8. నాయకత్వ లక్షణాలు", p:"నాయకుడనేవాడు ఆజ్ఞాపించేవాడు కాదు, అందరినీ కలుపుకుని బాధ్యతను స్వీకరించి నడిపించేవాడు."},
      {h:"9. ప్రశ్నించే తత్వం", p:"'నేను దీన్ని చేయలేను' అనే ప్రతికూల ఆలోచనల స్థానంలో 'దీన్ని ఎలా చేయగలను?' అని ప్రశ్నించాలి."},
      {h:"10. ఆశావహ దృక్పథం", p:"గతాన్ని మర్చిపోండి, భవిష్యత్తును నిర్మించుకోండి. ప్రతి రోజూ ఒక కొత్త అవకాశంగా భావించాలి."}
    ], sig:"మీ ఆలోచనలను మార్చుకోండి, మీ జీవితం ఆటోమేటిక్‌గా మారుతుంది."},
    {n:3, title:"రిచ్ డాడ్ పూర్ డాడ్ (తెలుగు)", author:"రాబర్ట్ కియోసాకి", year:"1997", core:"ఆర్థిక స్వాతంత్ర్యం కావాలంటే కేవలం ఉద్యోగం చేయడం సరిపోదు; డబ్బు మీ కోసం పనిచేసేలా ఆస్తులను సృష్టించాలి.", principles:[
      {h:"1. డబ్బు కోసం పని చేయవద్దు", p:"పేదలు జీతం కోసం రాత్రింబవళ్లు కష్టపడతారు. ధనవంతులు తమ డబ్బు ద్వారా డబ్బును సంపాదిస్తారు."},
      {h:"2. ఆర్థిక అక్షరాस्यత", p:"మీరు ఎంత డబ్బు సంపాదిస్తున్నారనేది కాదు, ఎంత డబ్బును దాచుకుంటున్నారు, ఎలా ఇన్వెస్ट చేస్తున్నారనేదే ముఖ్యం."},
      {h:"3. ఆస్తులు వర్సెస్ అప్పులు", p:"ఆస్తి అంటే మీ జేబులోకి డబ్బును తెచ్చేది. అప్పు అంటే మీ జేబులో నుండి డబ్బును తీసేసేది."},
      {h:"4. ఇల్లు ఆస్తి కాదు", p:"మీరు నివసించే ఇల్లు ఆస్తి కాదు—అది ఒక లయబిలిటీ (ఖర్చులు పెరుగుతాయి). రియల్ ఎస్టేట్, స్టాక్స్ అసలైన ఆస్తులు."},
      {h:"5. సొంత వ్యాపారం", p:"ఉద్యోగం చేస్తూనే, ఖాళీ సమయంలో మీ సొంత అసెట్ బేస్‌ను నిర్మించడం ప్రారంభించండి."},
      {h:"6. కార్పొరేషన్ల శక్తి", p:"ధనవంతులు కార్పొరేట్ సంస్థలను ఉపయోగించి పన్నులు ఆదా చేస్తారు, లీగల్‌గా తమ ఆదాయాన్ని కాపాడుకుంటారు."},
      {h:"7. అవకాశాల గుర్తింపు", p:"మార్కెట్ లో అందరికీ కనిపించని ఆర్థిక అవకాశాలను గుర్తించి, వాటిని పెట్టుబడిగా మార్చడం నేర్చుకోండి."},
      {h:"8. నైపుణ్యాల ప్రాధాన్యత", p:"కేవలం ఎక్కువ జీతం ఇచ్చే ఉద్యోగం కాకుండా, మీకు ఎక్కువ ఆర్థిక నైపుణ్యాలు నేర్పే పనిని ఎంచుకోండి."},
      {h:"9. నష్ట భయాన్ని వీడండి", p:"చాలా మంది డబ్బు నష్టపోతామనే భయంతో రిస్క్ తీసుకోరు. కానీ రిస్క్ తీసుకోకపోవడమే అతిపెద్ద రిస్క్."},
      {h:"10. మొదట మీకే చెల్లించుకోండి", p:"ఆదాయం రాగానే బిల్లులు కట్టే ముందు పెట్టుబడుల కోసం కనీసం 20% డబ్బును పక్కన పెట్టాలి."}
    ], sig:"డబ్బు కోసం మీరు పని చేయడం కాదు, డబ్బే మీ కోసం పని చేసేలా చేయడం నైపుణ్యం."},
    {n:4, title:"ఆలోచించండి - ఐశ్వర్యవంతులు అవ్వండి", author:"నెపోలియన్ హిల్", year:"1937", core:"ఐశ్వర్యం మరియు విజయం అనేవి ఒక బలమైన మానసిక సంకల్పం, తీవ్రమైన కోరిక మరియు నిరంతర ప్రణాళికల ద్వారానే సాధ్యమవుతాయి.", principles:[
      {h:"1. తీవ్రమైన కోరిక", p:"కేవలం ఆశ పడటం వల్ల డబ్బు రాదు. సాధించాలనే ఒక బలమైన, వెనకడుగు వేయని తీవ్రమైన కోరిక ఉండాలి."},
      {h:"2. అచంచలమైన నమ్మకం", p:"మీరు అనుకున్న లక్ష్యాన్ని సాధించగలరనే నమ్మకం మీ ఉపచేతన మనస్సును వేగంగా ఉద్దీపన చేస్తుంది."},
      {h:"3. స్వీయ సూచన", p:"ఉదయం, రాత్రి మీ ఆర్థిక లక్ష్యాలను చదవడం ద్వారా మీ ఆలోచనలను సంపద వైపు మళ్లించవచ్చు."},
      {h:"4. ప్రత్యేక జ్ఞానం", p:"సాధారణ జ్ఞానం వల్ల ఉపయోగం లేదు. ఒక నిర్దిష్ట రంగంలో లోతైన, ప్రత్యేకమైన నైపుణ్యం సంపాదించాలి."},
      {h:"5. ఊహ శక్తి", p:"ఆలోచనలను ఆచరణాత్మక రూపంలోకి మార్చడానికి మరియు సమస్యలకు వినూత్న పరిష్కారాలు కనుగొనడానికి ఊహ ఉపయోగపడుతుంది."},
      {h:"6. వ్యవస్థీకృత ప్రణాళిక", p:"ఒక ప్రణాళిక విఫలమైతే నిరాశ పడకుండా, వెంటనే మరో మెరుగైన ప్రణాళికను సిద్ధం చేసుకుని ముందుకు సాగాలి."},
      {h:"7. త్వరిత నిర్ణయాలు", p:"విజేతలు నిర్ణయాలు చాలా వేగంగా తీసుకుంటారు, వాటిని చాలా నెम्मतదిగా మారుస్తారు. సాగతీత పనికిరాదు."},
      {h:"8. పట్టుదల", p:"ఎన్ని అడ్డంకులు ఎదురైనా మీ ప్రయత్నాన్ని ఆపకపోవడమే పట్టుదల. ఓటమిని తాత్कालिक బ్రేక్ గా మాత్రమే భావించాలి."},

let currentLang = 'en';
let idx = 0;
let BOOKS = [];

function setLanguage(langCode) {
  stopSpeechEngine();
  currentLang = langCode;
  
  // Dynamic Context Matrix Expansion Engine Execution
  const rawList = BOOK_PARADIGMS[currentLang];
  const dict = CONFIG[currentLang];
  
  BOOKS = rawList.map(item => {
    return {
      n: item.n,
      title: item.title,
      author: item.author,
      year: item.year,
      cat: dict.cats[Math.floor((item.n - 1) / 17)] || dict.cats[0],
      core: item.core,
      concepts: item.principles,
      sig: item.sig || "Your mental configuration dictates your lived physical parameters."
    };
  });
  
  document.getElementById('libTitle').innerHTML = dict.appTitle;
  document.getElementById('contentsBtn').innerText = dict.indexBtn;
  document.getElementById('indexHeading').innerText = dict.indexHead;
  document.getElementById('closeOv').innerText = dict.closeBtn;
  document.getElementById('prev').innerHTML = dict.prevBtn;
  document.getElementById('next').innerHTML = dict.nextBtn;
  document.getElementById('navigationHint').innerText = dict.hint;
  
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.id === `btn-lang-${langCode}`);
  });

  rebuildIndexGrid();
  render();
}

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const pfill = document.getElementById('pfill');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const grid = document.getElementById('grid');

function esc(s){
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const b = BOOKS[idx];
  const num = String(b.n).padStart(2,'0');
  const dict = CONFIG[currentLang];
  
  const conceptsHTML = b.concepts.map((c,i)=>`
    <li style="animation-delay:${0.04 + i*0.02}s">
      <span class="mk">◆</span>
      <div>
        <h4>${esc(c.h)}</h4>
        <p>${c.p}</p>
      </div>
    </li>`).join('');

  stage.innerHTML = `
    <div class="book">
      <aside class="book-left">
        <div class="emblem">
          <div class="ring"></div>
          <div class="ring spin"></div>
          <div class="ring r2"></div>
          <div class="bignum">${num}</div>
        </div>
        <div class="cat">${esc(b.cat)}</div>
      </aside>
      <div class="book-main">
        <h1 class="b-title">${esc(b.title)}</h1>
        <div class="b-meta">${dict.authorLbl}: <b>${esc(b.author)}</b> &nbsp;·&nbsp; ${dict.yearLbl}: ${b.year}</div>
        <div class="core">
          <span class="lbl">${dict.coreLbl}</span>
          <p>${esc(b.core)}</p>
        </div>
        <ul class="concepts">${conceptsHTML}</ul>
        <div class="signature" style="animation-delay:${0.1 + b.concepts.length*0.02}s">
          <span class="lbl">${dict.principleLbl}</span>
          <p>“${esc(b.sig)}”</p>
        </div>
      </div>
    </div>`;

  counter.innerHTML = `<b>${num}</b> / 50`;
  pfill.style.width = ((b.n)/50*100)+'%';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === BOOKS.length - 1;
  
  document.querySelector('main').scrollTop = 0;
  updateGridActiveStates();
}

function rebuildIndexGrid() {
  grid.innerHTML = BOOKS.map((b,i)=>`
    <button class="gcard" data-i="${i}" onclick="jump(${i})">
      <span class="gn">${String(b.n).padStart(2,'0')}</span>
      <span class="gt">${esc(b.title)}<span class="ga">${esc(b.author)}</span></span>
    </button>`).join('');
}

function go(d){ 
  stopSpeechEngine();
  const t = idx + d; 
  if(t >= 0 && t < BOOKS.length){ idx = t; render(); } 
}

function jump(i){ 
  stopSpeechEngine();
  idx = i; 
  render(); 
  closeOverlay(); 
}

function updateGridActiveStates(){
  grid.querySelectorAll('.gcard').forEach((c,i) => c.classList.toggle('active', i === idx));
}

function toggleSpeech() {
  if (window.speechSynthesis.speaking) {
    stopSpeechEngine();
  } else {
    startSpeechEngine();
  }
}

function startSpeechEngine() {
  window.speechSynthesis.cancel(); 
  const b = BOOKS[idx];
  const dict = CONFIG[currentLang];
  
  let textSegments = [
    b.title,
    `${dict.authorLbl}: ${b.author}`,
    b.core
  ];
  
  b.concepts.forEach(c => {
    let plainText = c.p.replace(/<\/?[^>]+(>|$)/g, "");
    textSegments.push(`${c.h}. ${plainText}`);
  });
  
  textSegments.push(b.sig);
  
  const masterUtteranceString = textSegments.join('. ');
  const utterance = new SpeechSynthesisUtterance(masterUtteranceString);
  utterance.lang = dict.speechLang;
  utterance.rate = 1.0;
  
  utterance.onend = () => {
    stopSpeechEngine();
  };
  utterance.onerror = () => {
    stopSpeechEngine();
  };
  
  document.getElementById('speakBtn').innerText = dict.speakStop;
  document.getElementById('speakBtn').classList.add('reading-active');
  window.speechSynthesis.speak(utterance);
}

function stopSpeechEngine() {
  window.speechSynthesis.cancel();
  updateSpeakButtonLabel();
  document.getElementById('speakBtn').classList.remove('reading-active');
}

function updateSpeakButtonLabel() {
  document.getElementById('speakBtn').innerText = CONFIG[currentLang].speakStart;
}

prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);

addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'Escape') closeOverlay();
});

let tx = 0;
addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx; 
  if(Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive:true});

const overlay = document.getElementById('overlay');
document.getElementById('contentsBtn').onclick = () => {
  stopSpeechEngine();
  overlay.classList.add('open');
  updateGridActiveStates();
};

document.getElementById('closeOv').onclick = closeOverlay;
function closeOverlay(){ overlay.classList.remove('open'); }

(function(){
  const el = document.querySelector('.stars'); 
  let sh = [];
  for(let i=0; i<140; i++){
    sh.push(`${Math.floor(Math.random()*2000)}px ${Math.floor(Math.random()*2000)}px rgba(246,227,168,${0.25 + Math.random()*0.65})`);
  }
  const s = document.createElement('div');
  s.style.cssText = `position:absolute;width:1.2px;height:1.2px;border-radius:50%;box-shadow:${sh.join(',')};animation:fl 140s linear infinite`;
  const s2 = s.cloneNode(); 
  s2.style.top = '2000px';
  const st = document.createElement('style');
  st.textContent = '@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-2000px)}}';
  document.head.appendChild(st);
  el.appendChild(s); 
  el.appendChild(s2);
})();

setLanguage('en');
</script>
</body>
</html>
